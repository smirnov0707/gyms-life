name: Twin vertical navigation candidate
on:
  push:
    branches: [diagnostics/twin-navigation-2026-10-08]
permissions:
  contents: write
concurrency:
  group: twin-navigation-candidate
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init
    env:
      BASE: 656f4a6cb8fba5cddcab8c7b14eda67e906b3910
      FEATURE_BRANCH: feat/twin-larger-vertical-navigation-2026-10-08
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply the reviewed exact-base camera integration
        run: python3 diagnostics/apply-twin-navigation.py
      - run: npm ci
      - run: node scripts/verify-ci-browser-runtime.mjs
      - name: Format changed files using unchanged installed lint rules
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {ESLint} from 'eslint';
          const files=JSON.parse(readFileSync('test-results/navigation-files.json','utf8')).filter(f=>/\.(ts|tsx|mjs)$/.test(f));
          const eslint=new ESLint({fix:m=>m.ruleId==='prettier/prettier'});
          const results=await eslint.lintFiles(files);await ESLint.outputFixes(results);
          for(const result of results)assert.equal(result.errorCount,0,JSON.stringify(result.messages));
          JS
      - name: Verify complete quality and both builds without deployment
        shell: bash
        run: |
          set -euo pipefail
          { npm run typecheck; npm run test; npm run test:toolchain; npm run lint; npm run build:staging; npm run build; } 2>&1 | tee test-results/navigation-quality.log
      - name: Verify the actual larger body and native camera gestures
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-twin-camera-navigation.mjs 2>&1 | tee test-results/navigation-browser.log
      - name: Publish only verified source on a separate feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const repo=process.env.GITHUB_REPOSITORY,base=process.env.BASE;
          assert.equal(repo,'smirnov0707/gyms-life');
          const api=async(path,method='GET',body)=>{
            const response=await fetch(`https://api.github.com/repos/${repo}/${path}`,{method,headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});
            if(!response.ok)throw Error(`GitHub ${method} ${path}: ${response.status}`);
            return response.json();
          };
          assert.equal((await api('git/ref/heads/main')).object.sha,base,'Main changed; integrate explicitly');
          const files=JSON.parse(readFileSync('test-results/navigation-files.json','utf8'));
          assert.equal(files.length,11);assert.equal(new Set(files).size,11);
          assert.ok(files.every(f=>!f.startsWith('diagnostics/') && f!=='.github/workflows/twin-navigation-candidate.yml'));
          const tree=await api('git/trees','POST',{base_tree:(await api(`git/commits/${base}`)).tree.sha,tree:files.map(path=>({path,mode:'100644',type:'blob',content:readFileSync(path,'utf8')}))});
          const commit=await api('git/commits','POST',{message:'feat(twin): larger body canvas and bounded vertical camera navigation\n\nKeep 360-degree orbit, add vertical pan and wider tilt, upper/lower presets, keyboard alternatives and 44px up/down buttons. Fit the loaded body without deformation. Keep body-axis picking correct under pan and pitch. Quality/build and six real-WebGL gesture/layout groups passed in the pinned candidate runner. No production deployment or user-data changes.',tree:tree.sha,parents:[base]});
          await api('git/refs','POST',{ref:`refs/heads/${process.env.FEATURE_BRANCH}`,sha:commit.sha});
          const manifest={base,commit:commit.sha,tree:tree.sha,branch:process.env.FEATURE_BRANCH,files:files.map(path=>({path,sha256:createHash('sha256').update(readFileSync(path)).digest('hex')})),deployed:false};
          writeFileSync('test-results/verified-navigation.json',JSON.stringify(manifest,null,2));
          console.log(JSON.stringify(manifest,null,2));
          JS
      - name: Retain exact source after test discovery ends
        if: always()
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json,shutil
          manifest=Path('test-results/navigation-files.json')
          if manifest.exists():
              for name in json.loads(manifest.read_text()):
                  source=Path(name)
                  if source.is_file():
                      target=Path('test-results/navigation-source')/name
                      target.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copyfile(source,target)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twin-navigation-candidate-evidence
          path: test-results
          retention-days: 14
          if-no-files-found: error
