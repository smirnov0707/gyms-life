name: Coach composer browser
on:
  pull_request:
    paths:
      - "src/routes/_authenticated/coach.tsx"
      - "src/components/coach/**"
      - "src/components/ui/button.tsx"
      - "src/lib/i18n*"
      - "src/lib/language.schema.ts"
      - "src/styles.css"
      - "src/components/future-lab-*.css"
      - "tests/coach-conversation-browser/**"
      - "tests/core-browser/router-stub.tsx"
      - "tests/today-browser/start-stub.ts"
      - "scripts/test-coach-composer-browser.mjs"
      - "scripts/verify-ci-browser-runtime.mjs"
      - ".github/playwright-image.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/coach-composer-browser.yml"
  push:
    branches: [main]
    paths:
      - "src/routes/_authenticated/coach.tsx"
      - "src/components/coach/**"
      - "src/components/ui/button.tsx"
      - "src/lib/i18n*"
      - "src/lib/language.schema.ts"
      - "src/styles.css"
      - "src/components/future-lab-*.css"
      - "tests/coach-conversation-browser/**"
      - "tests/core-browser/router-stub.tsx"
      - "tests/today-browser/start-stub.ts"
      - "scripts/test-coach-composer-browser.mjs"
      - "scripts/verify-ci-browser-runtime.mjs"
      - ".github/playwright-image.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/coach-composer-browser.yml"
permissions:
  contents: read
concurrency:
  group: coach-composer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-ci-browser-runtime.mjs
      - run: node scripts/test-coach-composer-browser.mjs
        env:
          COACH_BROWSER_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coach-composer-${{ matrix.engine }}
          path: test-results/coach-composer
          if-no-files-found: error
          retention-days: 14
