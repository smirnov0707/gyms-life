name: Assemble and validate Twin 360
on:
  push:
    branches: [future-lab-phase-3-living-twin-foundation]
    paths: [.github/workflows/assemble-twin-360.yml]
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: future-lab-phase-3-living-twin-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integrate only the existing Twin presentation seam
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/components/TwinView.tsx')
          s = p.read_text()
          old = 'import { BodyMap, toneForRecoveryBand } from "@/components/twin/BodyMap";'
          if old in s:
              s = s.replace(old, 'import { TwinStage } from "@/components/twin/TwinStage";', 1)
              s = s.replace('  const anatomical = data.regions.filter((region) => isAnatomicalRegion(region.region));\n', '')
              start = s.index('          <div className="order-1 flex min-h-[500px]')
              end = s.index('          <aside className="order-3', start)
              s = s[:start] + '''          <div className="order-1 min-w-0 px-2 pb-4 lg:order-2">
                      <TwinStage snapshot={data} selectedRegion={selectedRegion} onSelectRegion={selectRegion}
                        view={view} onViewChange={setView} regionLabel={label} language={baseLang(lang)} />
                    </div>

          ''' + s[end:]
              s = s.replace('<aside className="order-2 px-5 pb-5 lg:order-1 lg:px-7 lg:pb-8">', '<aside aria-live="polite" data-twin-inspector className="order-2 px-5 pb-5 lg:order-1 lg:px-7 lg:pb-8">')
              s = s.replace('className="grid grid-cols-2 gap-x-6 gap-y-3 border-t', 'className="hidden grid-cols-2 gap-x-6 gap-y-3 sm:grid border-t')
              s = s.replace('value={region.volumeKg ? `${region.volumeKg} kg` : "—"}', 'value={region.volumeKg !== null ? `${region.volumeKg} kg` : "—"}')
              p.write_text(s)
          assert 'TwinStage snapshot={data}' in s or '<TwinStage' in s
          p = Path('src/components/twin/twin-scene.runtime.ts')
          s = p.read_text()
          for key in ['twinRenderer', 'twinYaw', 'twinDistance', 'twinFrames']:
              s = s.replace('canvas.dataset.' + key, 'canvas.dataset["' + key + '"]')
          p.write_text(s)
          p = Path('scripts/test-twin-browser.mjs')
          s = p.read_text().replace('if (id === "@/lib/digital-twin.functions")', 'if (id === "@/lib/digital-twin.functions" || id.endsWith("/src/lib/digital-twin.functions") || id.endsWith("/src/lib/digital-twin.functions.ts"))')
          p.write_text(s)
          PY
      - run: npx prettier --write src/components/TwinView.tsx src/components/twin/TwinStage.tsx src/components/twin/twin-*.ts src/lib/digital-twin.visual-state.ts tests/twin-browser scripts/test-twin-browser.mjs .github/workflows/twin-browser.yml
      - name: Remove completed one-off tooling and commit the integration
        run: |
          git rm .github/workflows/prepare-twin-360.yml .github/workflows/assemble-twin-360.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/TwinView.tsx src/components/twin src/lib/digital-twin.visual-state.ts tests/twin-browser scripts/test-twin-browser.mjs .github/workflows/twin-browser.yml
          git commit -m "feat(twin): wire the 360 stage into the existing evidence inspector"
          git pull --rebase origin future-lab-phase-3-living-twin-foundation
          git push origin HEAD:future-lab-phase-3-living-twin-foundation
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-twin-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twin-integration-evidence
          path: test-results/twin
          retention-days: 3
          if-no-files-found: ignore
