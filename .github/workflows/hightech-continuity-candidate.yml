      - name: Run unchanged original run cases and new continuity cases in both engines
        shell: bash
        run: |
          cat > scripts/.verify-hightech-candidate.mjs <<'JS'
          import {spawn} from 'node:child_process';
          import {mkdir,writeFile} from 'node:fs/promises';
          import {chromium,webkit,expect} from '@playwright/test';
          import {verifyEnduranceRunLog} from './test-core-endurance-log.mjs';
          const server=spawn(process.execPath,['scripts/test-core-browser.mjs','--serve-only'],{stdio:['ignore','pipe','pipe']});
          let browser;
          const results=[];const errors=[];
          try {
            await new Promise((resolve,reject)=>{
              const timer=setTimeout(()=>reject(Error('Fixture start timed out')),60000);
              server.stdout.on('data',b=>{process.stdout.write(b);if(String(b).includes('Core synthetic fixture:')){clearTimeout(timer);resolve();}});
              server.stderr.on('data',b=>process.stderr.write(b));
              server.once('exit',code=>{clearTimeout(timer);reject(Error(`Fixture exited ${code}`));});
            });
            for(const [engine,type] of [['chromium',chromium],['webkit',webkit]]) {
              const artifacts=`test-results/hightech-${engine}`;await mkdir(artifacts,{recursive:true});
              browser=await type.launch();
              const open=async(query,viewport)=>{
                const context=await browser.newContext({viewport,locale:'en-GB',timezoneId:'Europe/Vilnius'});
                const page=await context.newPage();page.on('pageerror',e=>errors.push({engine,message:String(e)}));
                await page.goto(`http://127.0.0.1:4184/index.html?${query}`);
                await expect(page.getByTestId('synthetic-watermark')).toBeVisible({timeout:30000});
                return {page,context};
              };
              const before=results.length;
              await verifyEnduranceRunLog({open,artifacts,record:name=>{results.push({engine,name,status:'passed'});console.log('PASS',engine,name);}});
              if(results.length-before!==21)throw Error(`Expected 14 original + 7 new groups, got ${results.length-before}`);
              await browser.close();browser=null;
            }
            if(errors.length)throw Error(JSON.stringify(errors));
          } finally {
            await browser?.close();server.kill('SIGTERM');
            await writeFile('test-results/hightech-results.json',JSON.stringify({results,errors,scope:'Real components with synthetic services; no live account/DB/device acceptance'},null,2));
          }
          JS
          node scripts/.verify-hightech-candidate.mjs
      - name: Publish only verified application files to a new feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const git=(...args)=>execFileSync('git',['-c',`safe.directory=${process.cwd()}`,...args],{encoding:'utf8'}).trim();
          const base=process.env.BASE,repo=process.env.GITHUB_REPOSITORY;
          const api=async(path,method='GET',data)=>{
            const r=await fetch(`https://api.github.com/repos/${repo}/${path}`,{method,headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});
            if(!r.ok)throw Error(`GitHub ${method} ${path}: ${r.status}`);
            return r.json();
          };
          assert.equal((await api('git/ref/heads/main')).object.sha,base,'Main changed; integrate before publishing');
          const files=JSON.parse(readFileSync('test-results/candidate-files.json','utf8'));
          assert.equal(files.length,10);assert.equal(new Set(files).size,10);
          const tree=await api('git/trees','POST',{base_tree:git('rev-parse',`${base}^{tree}`),tree:files.map(path=>({path,mode:'100644',type:'blob',content:readFileSync(path,'utf8')}))});
          const commit=await api('git/commits','POST',{message:'feat(endurance): high-tech run console and owner-scoped follow-up continuity\n\nPreserve pending plan checks across navigation and same-tab reload. Restore references, not stale consent. Share a theme-aware operational surface; visible labels, pressed environment selection and reduced motion. Full quality and 21 real-component groups per pinned browser passed before publication. No deployment or schema changes.',tree:tree.sha,parents:[base]});
          await api('git/refs','POST',{ref:`refs/heads/${process.env.FEATURE_BRANCH}`,sha:commit.sha});
          const manifest={commit:commit.sha,base,branch:process.env.FEATURE_BRANCH,files:files.map(path=>({path,sha256:createHash('sha256').update(readFileSync(path)).digest('hex')})),deployed:false};
          writeFileSync('test-results/verified-candidate.json',JSON.stringify(manifest,null,2));
          console.log(JSON.stringify(manifest,null,2));
          JS
