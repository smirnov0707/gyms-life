name: Night Lab review
on:
  pull_request:
    paths:
      - "src/**"
      - "netlify/functions/night-lab*.mts"
      - "tests/night-review-browser/**"
      - "tests/offline-browser/client.ts"
      - "scripts/test-night-*.mjs"
      - "scripts/test-browser-locale.mjs"
      - "scripts/test-application-environment.mjs"
      - "scripts/application-environment.build.ts"
      - "scripts/browser-test-locale.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/night-review.yml"
      - ".github/playwright-image.json"
      - "scripts/verify-ci-browser-runtime.mjs"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "netlify/functions/night-lab*.mts"
      - "tests/night-review-browser/**"
      - "tests/offline-browser/client.ts"
      - "scripts/test-night-*.mjs"
      - "scripts/test-browser-locale.mjs"
      - "scripts/test-application-environment.mjs"
      - "scripts/application-environment.build.ts"
      - "scripts/browser-test-locale.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/night-review.yml"
      - ".github/playwright-image.json"
      - "scripts/verify-ci-browser-runtime.mjs"
permissions:
  contents: read
concurrency:
  group: night-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-ci-browser-runtime.mjs
      - run: npm run test:bundle:night-lab
      - run: node scripts/test-application-environment.mjs
        env:
          CORE_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node scripts/test-browser-locale.mjs
        env:
          CORE_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: npm run test:browser:night-review
        env:
          CORE_BROWSER_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: night-review-${{ matrix.engine }}-evidence
          path: |
            test-results/night-review-browser
            test-results/night-worker-bundle/results.json
            test-results/browser-locale/results.json
            test-results/application-environment/results.json
            test-results/application-environment/*.png
            test-results/ci-browser-runtime.json
          retention-days: 14
          if-no-files-found: error
