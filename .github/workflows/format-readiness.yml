name: Format readiness surface

on:
  push:
    branches:
      - future-lab-phase-2-readiness-surface

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: future-lab-phase-2-readiness-surface
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/routes/_authenticated/readiness.tsx
      - run: npm run typecheck
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/readiness.tsx
          git diff --cached --quiet || git commit -m "style(recovery): format readiness surface"
          git push
