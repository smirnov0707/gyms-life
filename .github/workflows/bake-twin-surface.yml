name: Bake continuous Twin surface
on:
  push:
    branches: [future-lab-twin-continuous-surface]
    paths: [.github/workflows/bake-twin-surface.yml]
permissions:
  contents: write
jobs:
  bake:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: future-lab-twin-continuous-surface
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove only opposed duplicate zero-volume faces
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('scripts/generate-twin-surface.mjs')
          s = p.read_text()
          assert 'const reducedIndices = [];' in s
          s = s.replace('const reducedIndices = [];', 'let reducedIndices = [];', 1)
          marker = '// Tiny disconnected sampling islands are not anatomy.'
          assert marker in s
          insertion = '''// Simplification can collapse a tiny tetrahedral spur to two coincident,
          // oppositely wound faces. These enclose zero volume; remove BOTH faces.
          // Other duplicates or significant removals fail rather than hide a defect.
          const duplicateFaces = new Map();
          for (let i = 0; i < reducedIndices.length; i += 3) {
            const face = reducedIndices.slice(i, i + 3);
            const key = [...face].sort((a, b) => a - b).join(":");
            const records = duplicateFaces.get(key) ?? [];
            const parity = ((face[0] > face[1] ? 1 : 0) + (face[0] > face[2] ? 1 : 0) + (face[1] > face[2] ? 1 : 0)) % 2;
            records.push({ offset: i, parity });
            duplicateFaces.set(key, records);
          }
          const removeOffsets = new Set();
          for (const records of duplicateFaces.values()) {
            if (records.length === 1) continue;
            if (records.length !== 2 || records[0].parity === records[1].parity) {
              throw new Error("Unexpected duplicated surface faces require review");
            }
            records.forEach(({ offset }) => removeOffsets.add(offset));
          }
          if (removeOffsets.size * 3 > reducedIndices.length * 0.001) {
            throw new Error("Excess zero-volume surface faces require review");
          }
          reducedIndices = reducedIndices.filter((_, index) => !removeOffsets.has(index - index % 3));
          '''
          s = s.replace(marker, insertion + marker, 1)
          marker = 'const simplified = new Uint32Array(connected);'
          assert marker in s
          insertion = '''// The baked outer surface must be manifold and consistently oriented.
          const edgeUse = new Map();
          for (let i = 0; i < connected.length; i += 3) {
            const face = connected.slice(i, i + 3);
            for (let j = 0; j < 3; j++) {
              const a = face[j], b = face[(j + 1) % 3];
              const key = `${Math.min(a, b)}:${Math.max(a, b)}`;
              const value = edgeUse.get(key) ?? { count: 0, orientation: 0 };
              value.count++; value.orientation += a < b ? 1 : -1;
              edgeUse.set(key, value);
            }
          }
          if ([...edgeUse.values()].some(({ count, orientation }) => count !== 2 || orientation !== 0)) {
            throw new Error("Baked body must form a closed consistently oriented manifold");
          }
          '''
          p.write_text(s.replace(marker, insertion + marker, 1))
          PY
      - run: npx prettier --write scripts/generate-twin-surface.mjs
      - name: Bake offline surface
        run: |
          set -euo pipefail
          mkdir -p test-results/twin
          node scripts/generate-twin-surface.mjs | tee test-results/twin/surface-stats.json
      - name: Commit generated code only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-twin-surface.mjs src/components/twin/twin-body.surface.json
          git commit -m "fix(twin): bake a closed manifold without zero-volume simplification spurs"
          git push origin HEAD:future-lab-twin-continuous-surface
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-twin-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-twin-evidence
          path: |
            test-results/twin
            src/components/twin/twin-body.surface.json
          retention-days: 7
          if-no-files-found: warn
