name: Bake continuous Twin surface
on:
  push:
    branches: [future-lab-twin-continuous-surface]
    paths: [.github/workflows/bake-twin-surface.yml]
permissions:
  contents: write
jobs:
  bake:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: future-lab-twin-continuous-surface
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --save-dev --save-exact meshoptimizer@0.22.0
      - name: Prepare code-only validation
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          p = Path('src/components/twin/twin-body.geometry.test.ts')
          s = p.read_text().replace('["core", 2, 1.13, 0, -1, 0, 0]', '["core", 0.125, 1.13, 2, 0, 0, -1]')
          s = 'import { execFileSync } from "node:child_process";\nimport { mkdtempSync, readFileSync, rmSync } from "node:fs";\nimport { tmpdir } from "node:os";\nimport { join, resolve } from "node:path";\n' + s
          marker = 'describe("continuous generic Twin surface", () => {\n'
          assert marker in s
          s = s.replace(marker, marker + '''  it("reproduces the checked-in surface without touching production data", () => {
              const directory = mkdtempSync(join(tmpdir(), "twin-surface-"));
              const output = join(directory, "surface.json");
              try {
                execFileSync(process.execPath, [resolve("scripts/generate-twin-surface.mjs")], {
                  env: { ...process.env, TWIN_SURFACE_OUTPUT: output },
                  timeout: 20000,
                });
                expect(JSON.parse(readFileSync(output, "utf8"))).toEqual(surface);
              } finally {
                rmSync(directory, { recursive: true, force: true });
              }
            }, 30000);
          ''', 1)
          p.write_text(s)
          p = Path('tsconfig.json')
          data = json.loads(p.read_text())
          data['compilerOptions']['resolveJsonModule'] = True
          p.write_text(json.dumps(data, indent=2) + '\n')
          p = Path('.prettierignore')
          s = p.read_text()
          line = 'src/components/twin/twin-body.surface.json'
          if line not in s: p.write_text(s.rstrip() + '\n' + line + '\n')
          p = Path('scripts/generate-twin-surface.mjs')
          s = p.read_text()
          old = 'const [simplified] = MeshoptSimplifier.simplify(new Uint32Array(indices), new Float32Array(positions), 3, 48000, 0.001);'
          new = '''// Preserve shared colour-zone boundary edges during offline simplification.
          const rawGroups = Object.fromEntries(GROUPS.map((name) => [name, []]));
          for (let i = 0; i < indices.length; i += 3) {
            const face = indices.slice(i, i + 3);
            const centre = [0, 1, 2].map((axis) => face.reduce((sum, id) => sum + positions[id * 3 + axis], 0) / 3);
            rawGroups[regionAt(...centre)].push(...face);
          }
          const reducedIndices = [];
          const floatPositions = new Float32Array(positions);
          for (const group of Object.values(rawGroups)) {
            const target = Math.max(3, Math.floor((group.length / indices.length) * 16000) * 3);
            const [reduced] = MeshoptSimplifier.simplify(new Uint32Array(group), floatPositions, 3, target, 0.001, ["LockBorder"]);
            reducedIndices.push(...reduced);
          }
          // Tiny disconnected sampling islands are not anatomy. Keep the dominant
          // closed surface, failing rather than hiding a meaningful disconnection.
          const connections = new Map();
          for (let i = 0; i < reducedIndices.length; i += 3) {
            const face = reducedIndices.slice(i, i + 3);
            for (let j = 0; j < 3; j++) {
              const a = face[j], b = face[(j + 1) % 3];
              if (!connections.has(a)) connections.set(a, new Set());
              connections.get(a).add(b);
            }
          }
          const remaining = new Set(connections.keys());
          let largest = new Set();
          while (remaining.size) {
            const component = new Set();
            const pending = [remaining.values().next().value];
            while (pending.length) {
              const vertex = pending.pop();
              if (component.has(vertex)) continue;
              component.add(vertex); remaining.delete(vertex);
              for (const other of connections.get(vertex)) if (!component.has(other)) pending.push(other);
            }
            if (component.size > largest.size) largest = component;
          }
          const connected = [];
          for (let i = 0; i < reducedIndices.length; i += 3) {
            if (largest.has(reducedIndices[i])) connected.push(...reducedIndices.slice(i, i + 3));
          }
          if (connected.length < reducedIndices.length * 0.99) throw new Error("Meaningful body disconnection requires review");
          const simplified = new Uint32Array(connected);'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npx prettier --write scripts/generate-twin-surface.mjs src/components/twin/twin-body.geometry.ts src/components/twin/twin-body.geometry.test.ts tsconfig.json
      - name: Bake offline surface
        run: |
          set -euo pipefail
          mkdir -p test-results/twin
          node scripts/generate-twin-surface.mjs | tee test-results/twin/surface-stats.json
      - name: Commit generated code only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tsconfig.json .prettierignore scripts/generate-twin-surface.mjs src/components/twin/twin-body.geometry.ts src/components/twin/twin-body.geometry.test.ts src/components/twin/twin-body.surface.json
          git commit -m "feat(twin): bake a continuous human surface with preserved regional boundaries"
          git push origin HEAD:future-lab-twin-continuous-surface
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-twin-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-twin-evidence
          path: |
            test-results/twin
            src/components/twin/twin-body.surface.json
          retention-days: 7
          if-no-files-found: warn
