name: PR139 complete capture verification
on:
  push:
    branches: [diagnostics/pr139-capture-2026-10-07]
    paths: [.github/workflows/pr139-capture-verification.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-ci-browser-runtime.mjs
      - name: Apply the source-checked capture candidate
        run: |
          python3 diagnostics/pr139-capture-transform.py
          node_modules/.bin/prettier --write scripts/test-today-browser.mjs
          node --check scripts/test-today-browser.mjs
          node_modules/.bin/eslint scripts/test-today-browser.mjs
      - name: Prove all original assertions and the locally tested capture code are retained
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import ts from 'typescript';
          const source = readFileSync('scripts/test-today-browser.mjs', 'utf8');
          const prior = readFileSync('test-results/capture-validation/before.mjs', 'utf8');
          const bytes = Buffer.from(source);
          const blob = createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
          assert.equal(blob, '3f0791f7af274fdbc57645201ce3bc26b7722f29', 'Candidate must match the locally unit-tested file exactly');
          const printer = ts.createPrinter({removeComments:true});
          function assertions(text) {
            const file=ts.createSourceFile('test.mjs',text,ts.ScriptTarget.Latest,true,ts.ScriptKind.JS);
            const checks=[];
            function walk(node) {
              if(ts.isCallExpression(node)) {
                const expr=node.expression.getText(file);
                if(expr==='expect'||expr.startsWith('expect.')||expr.startsWith('expect(')||expr==='record') checks.push(printer.printNode(ts.EmitHint.Expression,node,file));
              }
              ts.forEachChild(node,walk);
            }
            walk(file);return checks;
          }
          assert.deepEqual(assertions(source),assertions(prior));
          writeFileSync('test-results/capture-validation/candidate.json',JSON.stringify({sourceHead:'34a668fc2d7af6433f56f33f8453b5333fee24aa',workflowHead:process.env.GITHUB_SHA,blob,assertionsAndRecords:assertions(source).length,scope:'Complete canonical Today suite; no visual or functional blocks removed'},null,2));
          JS
      - name: Run the complete real-component Today browser suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/today
          node scripts/test-today-browser.mjs 2>&1 | tee test-results/today/capture-verification.log
      - name: Retain a verified blob on the diagnostic branch only
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {owner,repo}=context.repo;
            const branch='diagnostics/pr139-capture-2026-10-07';
            const ref=await github.rest.git.getRef({owner,repo,ref:`heads/${branch}`});
            if(ref.data.object.sha!==context.sha) throw new Error('Diagnostic branch changed; refusing write');
            const path='scripts/test-today-browser.mjs';
            const prior=await github.rest.repos.getContent({owner,repo,path,ref:context.sha});
            const result=await github.rest.repos.createOrUpdateFileContents({owner,repo,branch,path,sha:prior.data.sha,message:'test(release): stabilize foreground evidence capture without retrying assertions',content:fs.readFileSync(path).toString('base64')});
            fs.writeFileSync('test-results/capture-validation/verified-commit.json',JSON.stringify({commit:result.data.commit.sha,blob:result.data.content.sha,scope:'Full Today suite passed on diagnostic branch; release PR gates remain required'},null,2));
            core.info(`Verified diagnostic commit: ${result.data.commit.sha}`);
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr139-capture-verification
          path: |
            test-results/today
            test-results/capture-validation/candidate.json
            test-results/capture-validation/verified-commit.json
          retention-days: 3
          if-no-files-found: error
