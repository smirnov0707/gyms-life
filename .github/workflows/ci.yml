name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Quality and security stay independent: an advisory cannot hide a type error,
# and a failing build cannot hide the dependency audit.
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency audit failure handling without registry access
        run: node --test scripts/dependency-audits.selftest.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Verify the patched build toolchain with synthetic fixtures
        run: npm run test:toolchain

      - name: Lint
        run: npm run lint

      - name: Build staging without deploying
        run: npm run build:staging

      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep the existing production moderate+ threshold and retain full-tree
      # findings. Registry/network/process failures are NOT vulnerability results:
      # either unavailable audit blocks, and both scopes are always attempted.
      # npm's dev classification does not prove absence from deployed bundles.
      - name: Audit and validate both dependency scopes
        run: node scripts/dependency-audits.mjs

      - name: Retain security evidence, including unavailable audits
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-evidence
          path: test-results/dependency-security
          retention-days: 14
          if-no-files-found: error
