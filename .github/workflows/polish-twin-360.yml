name: Polish Twin 360
on:
  push:
    branches: [future-lab-phase-3-living-twin-foundation]
    paths: [.github/workflows/polish-twin-360.yml]
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: future-lab-phase-3-living-twin-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reviewed presentation fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/components/twin/TwinStage.tsx')
          s = p.read_text()
          assert s.count('<select\n') == 1
          s = s.replace('<select\n', '<select\n            aria-label={copy.region}\n', 1)
          p.write_text(s)
          p = Path('src/components/TwinView.tsx')
          s = p.read_text()
          s = s.replace('import { useState } from "react";', 'import { useState } from "react";\nimport { useAuth } from "@/lib/auth";', 1)
          s = s.replace('export function TwinView() {\n', 'export function TwinView() {\n  const { user, loading: authLoading } = useAuth();\n', 1)
          s = s.replace('queryKey: ["twin-snapshot", timeZone],', 'queryKey: ["twin-snapshot", user?.id, timeZone],\n    enabled: Boolean(user),', 1)
          s = s.replace('  if (isLoading) {', '  if (isLoading || authLoading) {', 1)
          s = s.replace('lg:grid-cols-[300px_minmax(360px,1fr)_300px]', 'lg:grid-cols-[minmax(180px,0.8fr)_minmax(280px,1.3fr)_minmax(160px,0.7fr)]')
          p.write_text(s)
          p = Path('src/components/twin/twin-body.geometry.ts')
          s = p.read_text().replace('  SphereGeometry,', '  SphereGeometry,\n  SplineCurve,')
          # Smooth the trunk's profile instead of showing angular collar/waist bands.
          s = s.replace('  const trunk = new LatheGeometry(\n    [', '  const trunk = new LatheGeometry(\n    new SplineCurve([')
          s = s.replace('      new Vector2(0, 1.54),\n    ],\n    40,', '      new Vector2(0, 1.54),\n    ]).getPoints(64),\n    40,')
          s = s.replace('limb([0, 1.48, 0], [0, 1.65, 0], 0.056);', 'oval([0, 1.574, 0], [0.052, 0.096, 0.058]);')
          s = s.replace('oval([0, 1.68, 0.031], [0.066, 0.06, 0.062]);', 'oval([0, 1.687, 0.009], [0.062, 0.052, 0.061]);')
          s = s.replace('oval([0, 1.726, 0.082], [0.014, 0.027, 0.016]);', 'oval([0, 1.728, 0.08], [0.009, 0.02, 0.012]);')
          s = s.replace('[side * 0.103, 1.357, 0.103]', '[side * 0.103, 1.363, 0.084]')
          s = s.replace('[0.103, 0.101, 0.042]', '[0.112, 0.08, 0.038]')
          s = s.replace('[side * 0.087, 0.938, 0]', '[side * 0.087, 0.987, 0]')
          p.write_text(s)
          p = Path('src/components/twin/twin-scene.runtime.ts')
          s = p.read_text()
          s = s.replace('new HemisphereLight(0xf1f7ff, 0x14201c, 2.6)', 'new HemisphereLight(0xf1f7ff, 0x14201c, 1.6)')
          s = s.replace('[[2, 3, 4], 0xfff1db, 3.2]', '[[2, 3, 4], 0xfff1db, 2.2]')
          s = s.replace('[[-3, 1.7, 1], 0x9ccbe7, 1.9]', '[[-3, 1.7, 1], 0x9ccbe7, 0.9]')
          s = s.replace('[[0, 2.8, -3], 0xc4f0dd, 3.6]', '[[0, 2.8, -3], 0xc4f0dd, 2.0]')
          s = s.replace('const color = new Color(COLORS[value?.band ?? "unknown"]);', 'const color = new Color("#48565d").lerp(new Color(COLORS[value?.band ?? "unknown"]), 0.55);')
          p.write_text(s)
          p = Path('tests/twin-browser/fixture.tsx')
          s = p.read_text().replace('function Fixture() {', 'export function Fixture() {')
          p.write_text(s)
          PY
      - run: npx prettier --write src/components/TwinView.tsx src/components/twin/TwinStage.tsx src/components/twin/twin-body.geometry.ts src/components/twin/twin-scene.runtime.ts scripts/test-twin-browser.mjs tests/twin-browser
      - name: Commit reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/TwinView.tsx src/components/twin/TwinStage.tsx src/components/twin/twin-body.geometry.ts src/components/twin/twin-scene.runtime.ts scripts/test-twin-browser.mjs tests/twin-browser
          git diff --cached --quiet || git commit -m "fix(twin): improve schematic framing and accessible per-user inspection"
          git pull --rebase origin future-lab-phase-3-living-twin-foundation
          git push origin HEAD:future-lab-phase-3-living-twin-foundation
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-twin-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twin-polish-evidence
          path: test-results/twin
          retention-days: 3
          if-no-files-found: ignore
