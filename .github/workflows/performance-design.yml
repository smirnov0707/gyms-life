name: Performance design review
on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/test-performance-design.mjs"
      - "scripts/test-today-browser.mjs"
      - "tests/today-browser/**"
      - ".github/workflows/performance-design.yml"
      - "package*.json"
permissions:
  contents: read
concurrency:
  group: performance-design-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-ci-browser-runtime.mjs
      - run: node scripts/test-performance-design.mjs
        env:
          DESIGN_BROWSER_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-design-${{ matrix.engine }}
          path: test-results/performance-design
          retention-days: 14
          if-no-files-found: error
