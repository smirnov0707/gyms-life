name: Human realism workspace
on:
  push:
    branches: [future-lab-human-realism-preview]
    paths: [.github/workflows/human-realism-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked code, without credentials or media
        run: |
          mkdir -p "$RUNNER_TEMP/realism/source" "$RUNNER_TEMP/realism/export"
          git archive HEAD | tar -x --exclude=public --exclude='.env*' --exclude='.netlify' -C "$RUNNER_TEMP/realism/source"
          tar -czf "$RUNNER_TEMP/realism/export/source.tar.gz" -C "$RUNNER_TEMP/realism/source" .
          git rev-parse HEAD > "$RUNNER_TEMP/realism/export/source-ref.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: human-realism-source
          path: ${{ runner.temp }}/realism/export
          retention-days: 1
          if-no-files-found: error
