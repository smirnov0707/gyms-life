name: Twin navigation read-only review gallery
on:
  push:
    branches: [diagnostics/twin-navigation-source-2026-10-08]
    paths: [.github/workflows/twin-navigation-gallery.yml]
permissions:
  contents: write
  actions: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 11571560991
          run-id: 37825732615
          github-token: ${{ github.token }}
          path: /tmp/verified-navigation
      - name: Publish only synthetic screenshots in this diagnostic branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,readdirSync,statSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import path from 'node:path';
          const files=[];function walk(dir){for(const n of readdirSync(dir)){const p=path.join(dir,n);statSync(p).isDirectory()?walk(p):files.push(p);}}walk('/tmp/verified-navigation');
          const one=(name)=>{const found=files.filter(p=>p.endsWith('/'+name));assert.equal(found.length,1,name);return readFileSync(found[0]);};
          const results=JSON.parse(one('results.json'));assert.equal(results.results.length,6);assert.deepEqual(results.errors,[]);assert.equal(results.failure,null);
          const api=async(p,method='GET',data)=>{const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/${p}`,{method,headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});if(!r.ok)throw Error(`${method} ${p}: ${r.status}`);return r.json();};
          const branch=process.env.GITHUB_REF_NAME;
          const head=(await api(`git/ref/heads/${branch}`)).object.sha;assert.equal(head,process.env.GITHUB_SHA,'Diagnostic branch changed');
          const tree=[];
          const names=['lt-dark-320-old-size.png','lt-dark-320-larger.png','lt-dark-320-full.png','lt-light-390-lower-body.png','en-dark-1280-full.png','en-light-1280-larger.png'];
          for(const name of names){const blob=await api('git/blobs','POST',{content:one(name).toString('base64'),encoding:'base64'});tree.push({path:`docs/twin-navigation-review/${name}`,mode:'100644',type:'blob',sha:blob.sha});}
          const text=['# PR151 exact-source navigation review','', 'Application head: `299a9bc935de265e993d5531ac98dc2439d7cc54`. The subsequent picking-only candidate does not change application source.','Source: camera workflow 37825732615, artifact 11571560991, verified by actions/download-artifact against digest 048fec4f5713593ad931d30de6497edbccddf9c038c783f93f82773e4147efde.','', 'All figures use synthetic absent evidence and the registered generic Body model, not a live account. Canvas stays intentionally dark in both page themes. The first two images compare identical body/camera geometry at old and new canvas heights. No image generation or retouching. The whole-page captures show actual controls and evidence copy.','',...names.flatMap(n=>[`## ${n}`,`![${n}](${n})`,''])].join('\n');
          tree.push({path:'docs/twin-navigation-review/README.md',mode:'100644',type:'blob',content:text});
          tree.push({path:'docs/twin-navigation-review/results.json',mode:'100644',type:'blob',content:JSON.stringify(results,null,2)});
          const parent=await api(`git/commits/${head}`);
          const next=await api('git/trees','POST',{base_tree:parent.tree.sha,tree});
          const commit=await api('git/commits','POST',{message:'docs(diagnostics): exact synthetic Twin size and navigation review images',tree:next.sha,parents:[head]});
          await api(`git/refs/heads/${branch}`,'PATCH',{sha:commit.sha,force:false});
          console.log('GALLERY',commit.sha,`https://github.com/${process.env.GITHUB_REPOSITORY}/blob/${commit.sha}/docs/twin-navigation-review/README.md`);
          JS
