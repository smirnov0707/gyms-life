name: High-tech continuity final acceptance
on:
  push:
    branches: [diagnostics/hightech-continuity-2026-10-08]
    paths: [.github/workflows/hightech-continuity-final.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init
    env:
      BASE: f16d58020f9a2be73abca98ddea62660d5268208
      FEATURE_BRANCH: feat/endurance-high-tech-continuity-2026-10-08
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore candidate including retained-write recovery and fix heading readability
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import urllib.request, subprocess
          url='https://raw.githubusercontent.com/smirnov0707/gyms-life/8121d4d4532db29d51171cbd40d4b650aea58c1a/.github/workflows/hightech-continuity-final.yml'
          source=urllib.request.urlopen(url,timeout=30).read().decode('utf8')
          lines=source.splitlines();blocks=[];i=0
          while i<len(lines):
              if lines[i]=='        run: |':
                  i+=1;body=[]
                  while i<len(lines) and (lines[i].startswith('          ') or not lines[i]):
                      body.append(lines[i][10:] if lines[i] else '');i+=1
                  blocks.append('\n'.join(body)+'\n')
              else:i+=1
          assert len(blocks)==3,len(blocks)
          subprocess.run(['bash','-euo','pipefail','-c',blocks[0]],check=True)
          p=Path('src/components/QuickRunLog.tsx');s=p.read_text()
          old='className="gl-run-console grid gap-4"'
          assert s.count(old)==1
          s=s.replace(old,'className="gl-run-console grid gap-4 text-foreground"')
          old='<h3>{english ? "Record your run" : "Įrašyti bėgimą"}</h3>'
          assert s.count(old)==1
          s=s.replace(old,'<h3 className="text-foreground">{english ? "Record your run" : "Įrašyti bėgimą"}</h3>')
          p.write_text(s)
          p=Path('src/styles/system-notice.css');s=p.read_text()
          old='.gl-run-console header h3 {'
          assert s.count(old)==1
          p.write_text(s.replace(old,old+' color: var(--foreground);'))
          p=Path('scripts/test-core-run-continuity.mjs');s=p.read_text()
          old="await expect(page.getByText('Trukmė · min',{exact:true})).toBeVisible();"
          assert s.count(old)==1
          extra='''
              const headingStyle = await page.locator('[data-run-console] header h3').evaluate(el => {
                const probe = document.createElement('span');
                probe.style.color = 'var(--foreground)';
                el.parentElement.append(probe);
                const expected = getComputedStyle(probe).color;
                const actual = getComputedStyle(el);
                const result = { expected, color: actual.color, opacity: actual.opacity, size: parseFloat(actual.fontSize) };
                probe.remove();
                return result;
              });
              expect(headingStyle.color).toBe(headingStyle.expected);
              expect(headingStyle.opacity).toBe('1');
              expect(headingStyle.size).toBeGreaterThanOrEqual(16);'''
          p.write_text(s.replace(old,old+extra))
          p=Path('/tmp/hightech-publish.sh');s=p.read_text()
          old='assert.equal(prior.parents[0].sha,base);'
          assert s.count(old)==1
          s=s.replace(old,"assert.ok([base,'2ce72e5a0da76be7def3d9a0aa114da72d22dd90'].includes(prior.parents[0].sha),'Unexpected feature lineage');")
          p.write_text(s)
          PY
      - run: npm ci
      - run: node scripts/verify-ci-browser-runtime.mjs
      - name: Format only with installed ESLint rules
        shell: bash
        run: bash /tmp/hightech-format.sh
      - name: Verify all unit tests, TypeScript, lint, toolchain and both builds
        shell: bash
        run: |
          set -o pipefail
          bash /tmp/hightech-quality.sh 2>&1 | tee test-results/quality.log
      - name: Verify all 22 real run groups in Chromium and WebKit
        shell: bash
        run: |
          set -o pipefail
          bash /tmp/hightech-browser.sh 2>&1 | tee test-results/browser.log
      - name: Publish final tested source without deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash /tmp/hightech-publish.sh
      - name: Retain final source after test discovery ends
        if: always()
        shell: bash
        run: bash /tmp/hightech-retain.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hightech-continuity-final-evidence
          path: test-results
          retention-days: 14
          if-no-files-found: error
