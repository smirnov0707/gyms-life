name: High-tech continuity final acceptance
on:
  push:
    branches: [diagnostics/hightech-continuity-2026-10-08]
    paths: [.github/workflows/hightech-continuity-final.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init
    env:
      BASE: f16d58020f9a2be73abca98ddea62660d5268208
      FEATURE_BRANCH: feat/endurance-high-tech-continuity-2026-10-08
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore reviewed candidate and repair temporary retention recovery
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import urllib.request, subprocess
          url='https://raw.githubusercontent.com/smirnov0707/gyms-life/bb5e008008ba7545aad7fcbb5da10ee1add8ac84/.github/workflows/hightech-continuity-final.yml'
          source=urllib.request.urlopen(url,timeout=30).read().decode('utf8')
          lines=source.splitlines();blocks=[];i=0
          while i<len(lines):
              if lines[i]=='        run: |':
                  i+=1;body=[]
                  while i<len(lines) and (lines[i].startswith('          ') or not lines[i]):
                      body.append(lines[i][10:] if lines[i] else '');i+=1
                  blocks.append('\n'.join(body)+'\n')
              else:i+=1
          assert len(blocks)==3,len(blocks)
          subprocess.run(['bash','-euo','pipefail','-c',blocks[0]],check=True)
          Path('src/lib/use-endurance-follow-up.ts').write_text(r'''import { useCallback, useEffect, useRef, useState } from "react";
          import { offlineIdentity } from "./offline-identity";
          import { readEnduranceFollowUps, updateEnduranceFollowUps } from "./endurance-follow-up-store";
          const changed = "gymslife:endurance-follow-up-changed";

          export function useEnduranceFollowUp(ownerId: string | null) {
            const [sessionIds, setSessionIds] = useState<string[]>([]);
            const [storageUnavailable, setStorageUnavailable] = useState(false);
            const memory = useRef<string[]>([]);
            const pendingWrites = useRef(new Map<string, boolean>());
            const load = useCallback(() => {
              if (!ownerId || offlineIdentity.current() !== ownerId) return;
              try {
                let ids = readEnduranceFollowUps(window.sessionStorage, ownerId);
                // Reading an empty queue is not proof that an earlier refused write
                // succeeded. Reconcile local changes before clearing the warning.
                for (const [id, pending] of pendingWrites.current) {
                  ids = updateEnduranceFollowUps(window.sessionStorage, ownerId, id, pending);
                  pendingWrites.current.delete(id);
                }
                memory.current = ids;
                setSessionIds(ids);
                setStorageUnavailable(false);
              } catch {
                setStorageUnavailable(true);
                console.warn("[Endurance] FOLLOW_UP_READ_UNAVAILABLE");
              }
            }, [ownerId]);
            useEffect(() => {
              load();
              window.addEventListener(changed, load);
              return () => window.removeEventListener(changed, load);
            }, [load]);
            const remember = (sessionId: string, pending: boolean) => {
              if (!ownerId || offlineIdentity.current() !== ownerId) return;
              pendingWrites.current.set(sessionId, pending);
              try {
                const ids = updateEnduranceFollowUps(window.sessionStorage, ownerId, sessionId, pending);
                pendingWrites.current.delete(sessionId);
                memory.current = ids;
                setSessionIds(ids);
                setStorageUnavailable(pendingWrites.current.size > 0);
                window.dispatchEvent(new Event(changed));
              } catch {
                // The workout is saved; only the local continuation hint failed.
                memory.current = pending
                  ? [...new Set([...memory.current, sessionId])]
                  : memory.current.filter((id) => id !== sessionId);
                setSessionIds(memory.current);
                setStorageUnavailable(true);
                console.warn("[Endurance] FOLLOW_UP_RETENTION_UNAVAILABLE");
              }
            };
            return { sessionIds, storageUnavailable, remember, reload: load };
          }
          ''')
          p=Path('scripts/test-core-run-continuity.mjs');s=p.read_text()
          old="if(key.startsWith(p)) throw Error('Synthetic follow-up storage refusal');"
          assert s.count(old)==1
          s=s.replace(old,"if(key.startsWith(p) && !window.__allowFollowUpRetention) throw Error('Synthetic follow-up storage refusal');")
          old="await context.close(); record('Run continuity: secondary retention refusal never misreports the acknowledged save');"
          assert s.count(old)==1
          new='''await page.getByRole('button',{name:'Retry follow-up recovery',exact:true}).click();
              await expect(page.locator('[data-follow-up-storage-warning]')).toBeVisible();
              await page.evaluate(()=>{window.__allowFollowUpRetention=true;});
              await page.getByRole('button',{name:'Retry follow-up recovery',exact:true}).click();
              await expect(page.locator('[data-follow-up-storage-warning]')).toHaveCount(0);
              await page.reload();
              await expect(page.locator('[data-run-follow-up-check]')).toHaveCount(1);
              expect(await state(page)).toMatchObject({saves:1,records:1,retries:0});
              await context.close(); record('Run continuity: refused retention remains visible and recovers the pending hint before clearing the warning');'''
          p.write_text(s.replace(old,new))
          PY
      - run: npm ci
      - run: node scripts/verify-ci-browser-runtime.mjs
      - name: Format only with installed ESLint rules
        shell: bash
        run: bash /tmp/hightech-format.sh
      - name: Verify all unit tests, TypeScript, lint, toolchain and both builds
        shell: bash
        run: |
          set -o pipefail
          bash /tmp/hightech-quality.sh 2>&1 | tee test-results/quality.log
      - name: Verify all 22 real run groups in Chromium and WebKit
        shell: bash
        run: |
          set -o pipefail
          bash /tmp/hightech-browser.sh 2>&1 | tee test-results/browser.log
      - name: Publish final tested source without deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash /tmp/hightech-publish.sh
      - name: Retain final source after test discovery ends
        if: always()
        shell: bash
        run: bash /tmp/hightech-retain.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hightech-continuity-final-evidence
          path: test-results
          retention-days: 14
          if-no-files-found: error
