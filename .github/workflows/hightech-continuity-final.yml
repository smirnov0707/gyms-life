name: High-tech continuity final acceptance
on:
  push:
    branches: [diagnostics/hightech-continuity-2026-10-08]
    paths: [.github/workflows/hightech-continuity-final.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init
    env:
      BASE: f16d58020f9a2be73abca98ddea62660d5268208
      FEATURE_BRANCH: feat/endurance-high-tech-continuity-2026-10-08
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore the exact candidate and require an acknowledged save before navigation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import urllib.request, subprocess, re
          url='https://raw.githubusercontent.com/smirnov0707/gyms-life/c1ec10c11372f776486f80e5d18e2f97c8b23e5c/.github/workflows/hightech-continuity-final.yml'
          source=urllib.request.urlopen(url,timeout=30).read().decode('utf8')
          lines=source.splitlines();blocks=[];i=0
          while i<len(lines):
              if lines[i]=='        run: |':
                  i+=1;body=[]
                  while i<len(lines) and (lines[i].startswith('          ') or not lines[i]):
                      body.append(lines[i][10:] if lines[i] else '');i+=1
                  blocks.append('\n'.join(body)+'\n')
              else:i+=1
          assert len(blocks)==6,len(blocks)
          subprocess.run(['bash','-euo','pipefail','-c',blocks[0]],check=True)
          Path('/tmp/hightech-format.sh').write_text(blocks[1])
          Path('/tmp/hightech-retain.sh').write_text(blocks[5])
          p=Path('scripts/test-core-run-continuity.mjs');s=p.read_text()
          old='await expect(page.locator(\'[data-sonner-toast][data-type="success"]\')).toBeVisible();'
          assert s.count(old)==1
          new=old+'''
              // An earlier toast may still be visible. The current form must receive
              // its own acknowledgement and finish refreshing before navigation.
              await expect(page.getByRole('textbox',{name:lt?'Trukmė minutėmis':'Duration in minutes'})).toHaveValue('');
              await expect(page.getByRole('button',{name:lt?'Užskaityti bėgimą':'Credit this run',exact:true})).toBeEnabled();'''
          p.write_text(s.replace(old,new))
          p=Path('src/components/QuickRunLog.tsx');s=p.read_text()
          start=s.index('  const retryPlanCheck =');end=s.index('  const acceptMatch =',start)
          part=s[start:end]
          part,n=re.subn(r'\brestoredSessionId(?=\s*\n\s*\? english)', '(Boolean(restoredSessionId) || Boolean(savedRun?.verificationRequired))',part)
          assert n==1,n
          old='await refreshSavedRun(false, result.raceIntelligence);'
          assert part.count(old)==1
          part=part.replace(old,'if (!(result.raceEnrichment.status === "unavailable" && result.raceEnrichment.stage === "load")) '+old)
          p.write_text(s[:start]+part+s[end:])
          PY
      - run: npm ci
      - run: node scripts/verify-ci-browser-runtime.mjs
      - name: Format only with installed ESLint rules
        shell: bash
        run: bash /tmp/hightech-format.sh
      - name: Verify all unit tests, TypeScript, lint, toolchain and both builds
        shell: bash
        run: |
          set -o pipefail
          bash /tmp/hightech-quality.sh 2>&1 | tee test-results/quality.log
      - name: Verify all 22 real run groups in Chromium and WebKit
        shell: bash
        run: |
          set -o pipefail
          bash /tmp/hightech-browser.sh 2>&1 | tee test-results/browser.log
      - name: Publish final tested source without deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash /tmp/hightech-publish.sh
      - name: Retain final source after test discovery ends
        if: always()
        shell: bash
        run: bash /tmp/hightech-retain.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hightech-continuity-final-evidence
          path: test-results
          retention-days: 14
          if-no-files-found: error
