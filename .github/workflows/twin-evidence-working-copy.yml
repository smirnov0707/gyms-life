name: Twin evidence working copy
on:
  push:
    branches: [future-lab-twin-evidence-and-volume]
    paths: [.github/workflows/twin-evidence-working-copy.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package tracked code and installed dependencies only
        run: |
          git archive --format=tar HEAD > /tmp/twin-working-copy.tar
          tar --append --file=/tmp/twin-working-copy.tar node_modules
          gzip /tmp/twin-working-copy.tar
      - uses: actions/upload-artifact@v4
        with:
          name: twin-working-copy
          path: /tmp/twin-working-copy.tar.gz
          retention-days: 1
          compression-level: 0
