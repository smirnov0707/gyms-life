name: Materialize tested Lab evidence
on:
  push:
    branches: [diagnostics/lab-read-recovery-2026-10-09]
    paths: [.github/workflows/lab-evidence-materialize.yml]
permissions:
  actions: read
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify original evidence and materialize immutable blob objects only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {writeFileSync,readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const repo=process.env.GITHUB_REPOSITORY;
          assert.equal(repo,'smirnov0707/gyms-life');
          const api=async(path,method='GET',data)=>{
            const response=await fetch(`https://api.github.com/repos/${repo}/${path}`,{method,headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});
            if(!response.ok)throw Error(`${method} ${path}: ${response.status} ${(await response.text()).slice(0,700)}`);
            return response;
          };
          const source='abe730051753c22ae696099d1e69f19ac01785d4';
          const base='d825d6853af2a8bb0716b3e0a519a5241be3eef6';
          assert.equal((await(await api('git/ref/heads/main')).json()).object.sha,base);
          assert.equal((await(await api('pulls/155')).json()).head.sha,source);
          const logs=await(await api('actions/jobs/113750813578/logs')).text();
          const exceptions=logs.split('\n').filter(line=>/Error:|AssertionError|Unexpected changed file src\//.test(line)&&!line.includes('assert.')).slice(-8);
          console.log('ORIGINAL_RECORD_DIAGNOSIS',JSON.stringify(exceptions));
          assert.ok(logs.includes('Error: POST git/trees: 403'),'Original failure must be the confirmed tree-write permission boundary, not an unreviewed source mutation');
          const artifact=await(await api('actions/artifacts/11606420019')).json();
          assert.equal(artifact.workflow_run.id,37909454749);
          assert.equal(artifact.workflow_run.head_sha,'eaa0bf72e29bf12bf4797da788f92f9e78555e0a');
          assert.equal(artifact.name,'active-lab-route-recovery-evidence');
          assert.equal(artifact.expired,false);
          const zip=Buffer.from(await(await api('actions/artifacts/11606420019/zip')).arrayBuffer());
          const digest=createHash('sha256').update(zip).digest('hex');
          assert.equal(digest,'4ec19c1c45cdc944e597e5352d030d16f6e9792b28fbcee31c57bce2cfb8f1f3');
          assert.equal(artifact.digest,`sha256:${digest}`);
          assert.ok(zip.length<10_000_000);
          writeFileSync('evidence.zip',zip);
          const paths=['src/components/LabView.tsx','src/components/lab/LabDecisionHistory.tsx','src/components/lab/lab-read.copy.ts','src/components/lab/lab-view.copy.ts','src/components/lab/useLabReadRecovery.ts','src/components/future-lab/LabCommandDeck.tsx','src/components/lab/lab-availability.test.tsx','tests/lab-browser/fixture.tsx','tests/lab-browser/services.ts','scripts/test-lab-availability-browser.mjs','.github/workflows/lab-availability-browser.yml','docs/lab-read-state-recovery.md'];
          writeFileSync('expected-paths.json',JSON.stringify(paths));
          execFileSync('python3',['-c',`import json,zipfile
          with zipfile.ZipFile('evidence.zip') as z:
            assert len(z.namelist())==len(set(z.namelist()))
            paths=json.load(open('expected-paths.json'))
            data={p:z.read('lab-route-recovery/reviewed-source/'+p).decode('utf-8') for p in paths}
            browsers=[json.loads(z.read('lab-availability/'+e+'/results.json')) for e in ['chromium','webkit']]
            json.dump({'files':data,'browsers':browsers},open('materialized.json','w'))`]);
          const {files,browsers}=JSON.parse(readFileSync('materialized.json','utf8'));
          for(const result of browsers){
            assert.equal(result.results.length,30);assert.deepEqual(result.errors,[]);assert.equal(result.failure,null);
            for(const surface of ['overview','deck'])assert.equal(result.results.filter(group=>group.surface===surface&&group.status==='passed').length,15);
          }
          const entries=[];
          for(const path of paths){
            const content=files[path];
            assert.equal(typeof content,'string');assert.ok(Buffer.byteLength(content)<100000);
            const bytes=Buffer.from(content);
            const expected=createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            const blob=await(await api('git/blobs','POST',{content,encoding:'utf-8'})).json();
            assert.equal(blob.sha,expected);
            entries.push({path,mode:'100644',type:'blob',sha:blob.sha,sha256:createHash('sha256').update(bytes).digest('hex')});
          }
          const manifest={source,base,sourceTree:'1b64df35867bacb85e0ec3104c8ef0bfbb3de1da',originalRun:37909454749,artifact:11606420019,digest,entries,browsers:browsers.map(({engine,results})=>({engine,groups:results.length})),refsChanged:false,deployed:false};
          writeFileSync('materialized-lab-manifest.json',JSON.stringify(manifest,null,2));
          console.log('MATERIALIZED_LAB_BLOBS',JSON.stringify(manifest));
          JS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: materialized-lab-manifest
          path: materialized-lab-manifest.json
          if-no-files-found: error
          retention-days: 14
