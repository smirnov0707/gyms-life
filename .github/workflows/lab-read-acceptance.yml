name: Lab read recovery exact-source acceptance
on:
  push:
    branches: [diagnostics/lab-read-recovery-2026-10-09]
    paths: [.github/workflows/lab-read-acceptance.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init
    env:
      BASE: d825d6853af2a8bb0716b3e0a519a5241be3eef6
      SOURCE: 2feea8f54d1bf0ebabcf879cddeba3c30fca8dbe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Respect exact optional props when forwarding an intentionally absent action
        run: |
          python3 <<'PY'
          from pathlib import Path
          for name in ['src/components/LabView.tsx','src/components/lab/LabReadNotice.tsx']:
              p=Path(name);s=p.read_text()
              assert s.count('onRetry?: () => void;')==1,name
              p.write_text(s.replace('onRetry?: () => void;','onRetry?: (() => void) | undefined;'))
          PY
      - run: npm ci
      - run: node scripts/verify-ci-browser-runtime.mjs
      - name: Format only new and intentionally changed source with the installed rules
        shell: bash
        run: |
          mkdir -p test-results/lab-recovery
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          import {ESLint} from 'eslint';
          const files=['src/components/LabView.tsx','src/components/lab/lab-read.copy.ts','src/components/lab/LabReadNotice.tsx','src/components/lab/LabDecisionHistory.tsx','src/components/lab/lab-availability.test.tsx','tests/lab-browser/data.ts','tests/lab-browser/services.ts','tests/lab-browser/fixture.tsx','scripts/test-lab-availability-browser.mjs'];
          const eslint=new ESLint({fix:message=>message.ruleId==='prettier/prettier'});
          const results=await eslint.lintFiles(files);
          await ESLint.outputFixes(results);
          for(const result of results)assert.equal(result.errorCount,0,JSON.stringify({file:result.filePath,messages:result.messages}));
          writeFileSync('test-results/lab-recovery/source-files.json',JSON.stringify(files,null,2));
          JS
      - name: Full quality and both builds without deployment
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee test-results/lab-recovery/typecheck.log
          npm run test 2>&1 | tee test-results/lab-recovery/tests.log
          npm run test:toolchain 2>&1 | tee test-results/lab-recovery/toolchain.log
          npm run lint 2>&1 | tee test-results/lab-recovery/lint.log
          npm run build:staging 2>&1 | tee test-results/lab-recovery/build-staging.log
          npm run build 2>&1 | tee test-results/lab-recovery/build.log
      - name: Real Lab components and query recovery in Chromium and WebKit
        shell: bash
        run: |
          set -euo pipefail
          LAB_BROWSER_ENGINE=chromium node scripts/test-lab-availability-browser.mjs 2>&1 | tee test-results/lab-recovery/browser-chromium.log
          LAB_BROWSER_ENGINE=webkit node scripts/test-lab-availability-browser.mjs 2>&1 | tee test-results/lab-recovery/browser-webkit.log
      - name: Record the exact tested source commit object only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const git=(...args)=>execFileSync('git',['-c',`safe.directory=${process.cwd()}`,...args],{encoding:'utf8'}).trim();
          assert.equal(git('rev-parse','HEAD'),process.env.SOURCE);
          const files=JSON.parse(readFileSync('test-results/lab-recovery/source-files.json','utf8'));
          const modified=git('diff','--name-only').split('\n').filter(Boolean);
          for(const name of modified)assert.ok(files.includes(name),`Unexpected file modification ${name}`);
          const browsers=['chromium','webkit'].map(engine=>JSON.parse(readFileSync(`test-results/lab-availability/${engine}/results.json`,'utf8')));
          for(const result of browsers){assert.equal(result.results.length,15);assert.deepEqual(result.errors,[]);assert.equal(result.failure,null);}
          const api=async(p,method='GET',data)=>{const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/${p}`,{method,headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});if(!r.ok)throw Error(`${method} ${p}: ${r.status}`);return r.json();};
          assert.equal((await api('git/ref/heads/main')).object.sha,process.env.BASE,'Main advanced; reconcile before publishing');
          const entries=files.map(path=>({path,mode:'100644',type:'blob',content:readFileSync(path,'utf8')}));
          const tree=await api('git/trees','POST',{base_tree:git('rev-parse','HEAD^{tree}'),tree:entries});
          const commit=await api('git/commits','POST',{message:'fix(lab): verified truthful partial-history and query recovery surfaces\n\nPreserve strict optional-action types and format reviewed source with existing rules. Full quality/build/toolchain and 15 groups in each browser passed before object creation. No branch updated or production deployed; normal final-head checks remain required.',tree:tree.sha,parents:[process.env.SOURCE]});
          const all=[...files,'tests/lab-browser/index.html','docs/lab-read-state-recovery.md','.github/workflows/lab-availability-browser.yml'];
          const manifest={commit:commit.sha,tree:tree.sha,source:process.env.SOURCE,base:process.env.BASE,files:all.map(path=>({path,sha256:createHash('sha256').update(readFileSync(path)).digest('hex')})),browsers:browsers.map(({engine,results})=>({engine,groups:results.length})),branchUpdated:false,deployed:false};
          writeFileSync('test-results/lab-recovery/verified-source.json',JSON.stringify(manifest,null,2));
          console.log('VERIFIED_SOURCE',JSON.stringify(manifest));
          JS
      - name: Retain exact source only after all tests have finished
        if: always()
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import shutil
          paths=['src/components/LabView.tsx','src/components/lab/lab-read.copy.ts','src/components/lab/LabReadNotice.tsx','src/components/lab/LabDecisionHistory.tsx','src/components/lab/lab-availability.test.tsx','tests/lab-browser/data.ts','tests/lab-browser/services.ts','tests/lab-browser/fixture.tsx','tests/lab-browser/index.html','scripts/test-lab-availability-browser.mjs','docs/lab-read-state-recovery.md','.github/workflows/lab-availability-browser.yml']
          for name in paths:
              source=Path(name)
              if source.exists():
                  target=Path('test-results/lab-recovery/reviewed-source')/name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(source,target)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-read-recovery-evidence
          path: |
            test-results/lab-recovery
            test-results/lab-availability
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
