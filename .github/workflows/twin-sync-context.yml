name: Twin concurrent change context
on:
  push:
    branches: [future-lab-twin-evidence-and-volume]
    paths: [.github/workflows/twin-sync-context.yml]
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export the exact intervening main changes
        run: |
          git fetch --depth=1 origin 92817c0f6151d823758a00df55f870d060b177fd b7680640ade7f2a6e1be9b551b528b9467956746
          git diff --binary 92817c0f6151d823758a00df55f870d060b177fd b7680640ade7f2a6e1be9b551b528b9467956746 > /tmp/twin-main-update.patch
      - uses: actions/upload-artifact@v4
        with:
          name: twin-concurrent-main-diff
          path: /tmp/twin-main-update.patch
          retention-days: 1
