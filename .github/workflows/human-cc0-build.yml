name: Build CC0 GYMS.LIFE digital human
on:
  push:
    branches: [future-lab-human-realism-intake]
    paths: [.github/workflows/human-cc0-build.yml]
permissions:
  contents: read
jobs:
  build-human:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone headless MakeHuman build tooling
        run: git clone --depth 1 https://github.com/vidya-hub/makehuman-core.git "$RUNNER_TEMP/makehuman-core"
      - name: Install generator dependencies
        run: |
          python -m pip install -e "$RUNNER_TEMP/makehuman-core"
          python -m pip install pillow
      - name: Author and optimize CC0 Digital Human v2
        env:
          MHCORE_DATA: ${{ runner.temp }}/makehuman-core/data
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          import numpy as np
          from PIL import Image, ImageFilter, ImageOps
          import mhcore

          root = Path(os.environ['RUNNER_TEMP']) / 'gyms-human-v2'
          root.mkdir(parents=True, exist_ok=True)
          data = Path(os.environ['MHCORE_DATA'])

          def recolor_first_diffuse(folder: Path, black: str, white: str, mix=0.88):
              candidates = [p for p in folder.glob('*') if p.suffix.lower() in {'.png','.jpg','.jpeg'} and ('diffuse' in p.name.lower() or 'texture' in p.name.lower())]
              if not candidates:
                  candidates = [p for p in folder.glob('*.png')]
              if not candidates: return
              path = candidates[0]
              img = Image.open(path).convert('RGBA')
              alpha = img.getchannel('A')
              rgb = img.convert('RGB')
              toned = ImageOps.colorize(ImageOps.grayscale(rgb), black=black, white=white)
              out = Image.blend(rgb, toned, mix)
              out.putalpha(alpha)
              out.save(path, optimize=True)

          recolor_first_diffuse(data/'clothes/male_casualsuit06', '#101419', '#66747b', 0.9)
          recolor_first_diffuse(data/'clothes/shoes01', '#090c10', '#4b565d', 0.92)

          h = mhcore.new_human()
          h.set_gender(1.0).set_age(0.47).set_weight(0.51).set_muscle(0.66).set_height(0.62)
          for name, value in [
              ('head/head-oval', 0.16),
              ('nose/nose-scale-vert-decr|incr', 0.06),
              ('chin/chin-height-decr|incr', 0.05),
          ]:
              try: h.apply_modifier(name, value)
              except Exception: pass

          def pick(kind, token):
              matches = [p for p in h.list_available(kind) if token.lower() in str(p).lower()]
              if not matches: raise RuntimeError(f'Missing {kind} asset: {token}')
              return matches[0]

          h.set_skin(pick('skins', 'young_caucasian_male2'))
          h.equip_hair(pick('hair', 'short02'))
          h.equip_eyes(pick('eyes', 'high-poly'))
          h.equip_eyebrows(pick('eyebrows', 'eyebrow006'))
          h.equip_eyelashes(pick('eyelashes', 'eyelashes01'))
          h.equip_teeth(pick('teeth', 'teeth_base'))
          h.equip_clothes(pick('clothes', 'male_casualsuit06'))
          h.equip_clothes(pick('clothes', 'shoes01'))

          h.save_mhm(str(root/'gyms-digital-human-v2.mhm'))
          obj = Path(h.export(str(root/'gyms-digital-human-v2.obj')))
          mtl = obj.with_suffix('.mtl')
          if not obj.exists() or not mtl.exists(): raise RuntimeError('MakeHuman export missing')

          # Copy referenced maps locally, then convert opaque maps to JPEG and bound all maps.
          def locate(raw: str):
              src = Path(raw)
              if not src.is_absolute(): src = (mtl.parent/src).resolve()
              if src.exists(): return src
              matches = list(data.rglob(Path(raw).name))
              return matches[0] if matches else None

          def optimize(src: Path, semantic: str):
              img = Image.open(src).convert('RGBA')
              limit = 2048 if ('skin' in src.name.lower() or 'young_light' in src.name.lower()) else 1024
              if max(img.size) > limit:
                  scale = limit / max(img.size)
                  img = img.resize((max(1,round(img.width*scale)), max(1,round(img.height*scale))), Image.Resampling.LANCZOS)
              alpha = img.getchannel('A')
              has_alpha = alpha.getextrema()[0] < 250
              stem = src.stem.replace(' ', '_')
              if has_alpha:
                  dst = root/f'{stem}.png'
                  img.save(dst, optimize=True, compress_level=9)
              else:
                  dst = root/f'{stem}.jpg'
                  quality = 91 if limit == 2048 else 88
                  img.convert('RGB').save(dst, quality=quality, optimize=True, progressive=True, subsampling=0)
              return dst

          lines = mtl.read_text(errors='replace').splitlines()
          rewritten=[]; skin_albedo=None
          for line in lines:
              stripped=line.strip()
              prefixes=('map_Kd ','map_Bump ','bump ','map_Ks ','map_d ')
              if stripped.startswith(prefixes):
                  parts=stripped.split(); raw=parts[-1]; src=locate(raw)
                  if src:
                      semantic=parts[0]
                      dst=optimize(src, semantic)
                      line=' '.join(parts[:-1]+[dst.name])
                      if parts[0]=='map_Kd' and ('young_light' in src.name.lower() or 'skin' in src.name.lower()): skin_albedo=dst
              rewritten.append(line)
          mtl.write_text('\n'.join(rewritten)+'\n')

          # Subtle 1K authored skin normal; compression-friendly, no invented physiology.
          if skin_albedo and skin_albedo.exists():
              img=Image.open(skin_albedo).convert('RGB').resize((1024,1024),Image.Resampling.LANCZOS)
              grey=np.asarray(ImageOps.grayscale(img),dtype=np.float32)/255.0
              low=np.asarray(ImageOps.grayscale(img).filter(ImageFilter.GaussianBlur(2.5)),dtype=np.float32)/255.0
              gy,gx=np.gradient(grey-low); strength=2.8
              nx,ny,nz=-gx*strength,gy*strength,np.ones_like(gx)
              norm=np.sqrt(nx*nx+ny*ny+nz*nz)
              arr=np.stack([nx/norm*.5+.5,ny/norm*.5+.5,nz/norm*.5+.5],axis=-1)
              normal=root/'skin_detail_normal.jpg'
              Image.fromarray(np.clip(arr*255,0,255).astype(np.uint8),'RGB').save(normal,quality=90,optimize=True,progressive=True,subsampling=0)
              old=mtl.read_text().splitlines(); out=[]; inserted=False
              for line in old:
                  out.append(line)
                  if line.startswith('map_Kd ') and skin_albedo.name in line:
                      out.append(f'map_Bump {normal.name}'); inserted=True
              mtl.write_text('\n'.join(out)+'\n')

          manifest={
            'name':'GYMS.LIFE Digital Human v2 candidate',
            'authorship':'GYMS.LIFE-authored character parameters, graphite materials and derived skin-detail normal',
            'base':'MakeHuman core/system graphical assets',
            'license':'CC0-1.0 graphical asset derivative; external build tooling not redistributed',
            'sources':['https://static.makehumancommunity.org/assets/assetpacks/makehuman_system_assets.html','https://static.makehumancommunity.org/makehuman/faq/can_i_sell_models_created_with_makehuman.html'],
            'body_parameters':{'gender':1.0,'age':0.47,'weight':0.51,'muscle':0.66,'height':0.62},
            'assets':['young_caucasian_male2','short02','high-poly eyes','eyebrow006','eyelashes01','teeth_base','male_casualsuit06','shoes01'],
            'personal_scan':False,'identity_claim':False,'visual_acceptance':False
          }
          (root/'SOURCE_MANIFEST.json').write_text(json.dumps(manifest,indent=2))
          print('OBJ',obj.stat().st_size,'bytes')
          print('textures',sum(p.stat().st_size for p in root.iterdir() if p.suffix.lower() in {'.png','.jpg','.jpeg'}),'bytes')
          PY
      - name: Convert to self-contained GLB
        run: |
          cd "$RUNNER_TEMP/gyms-human-v2"
          npx --yes obj2gltf@3.2.0 -i gyms-digital-human-v2.obj -o gyms-digital-human-v2.glb -b --secure --checkTransparency
      - name: Record integrity and audit without suppressing artifact
        id: audit
        continue-on-error: true
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'gyms-human-v2'; glb=root/'gyms-digital-human-v2.glb'
          sha=hashlib.sha256(glb.read_bytes()).hexdigest()
          rights={'assetSha256':sha,'creator':'GYMS.LIFE derivative authored from MakeHuman CC0 graphical assets','sourceUrl':'https://static.makehumancommunity.org/assets/assetpacks/makehuman_system_assets.html','licenseName':'CC0-1.0-derived','evidenceReference':'SOURCE_MANIFEST.json + official MakeHuman CC0 asset pack/FAQ','permissions':{'commercialWebApp':'approved','browserDelivery':'approved','publicRepository':'approved'}}
          (root/'rights.json').write_text(json.dumps(rights,indent=2)); print('GLB',glb.stat().st_size,'SHA256',sha)
          PY
          node scripts/audit-twin-human-asset.mjs "$RUNNER_TEMP/gyms-human-v2/gyms-digital-human-v2.glb" "$RUNNER_TEMP/gyms-human-v2/rights.json" "$RUNNER_TEMP/gyms-human-v2/intake-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gyms-digital-human-v2-candidate
          path: ${{ runner.temp }}/gyms-human-v2
          retention-days: 2
          if-no-files-found: error
      - name: Enforce intake gate after preserving review artifact
        if: always()
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'gyms-human-v2'/'intake-report.json'
          report=json.loads(p.read_text())
          print(json.dumps(report,indent=2))
          if not report.get('technicalPreflightPassed'): sys.exit(2)
          PY
