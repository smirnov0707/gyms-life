name: Twin camera diagnostics
on:
  push:
    branches: [future-lab-twin-mobile-cockpit]
    paths: [.github/workflows/twin-camera-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Instrument the disposable runner workspace only
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/components/twin/twin-scene.runtime.ts')
          s = p.read_text()
          s = s.replace('const command = (action: TwinCameraCommand) => {', 'const command = (action: TwinCameraCommand) => {\n      canvas.dataset["debugCommand"] = action;\n      canvas.dataset["debugCommandCount"] = String(Number(canvas.dataset["debugCommandCount"] || 0) + 1);\n      canvas.dataset["debugVisible"] = String(visible());\n      canvas.dataset["debugFrameId"] = String(frameId);')
          s = s.replace('camera.position\n        .copy(controls.target)', 'canvas.dataset["debugDesiredYaw"] = String(next.yaw);\n      camera.position\n        .copy(controls.target)')
          s = s.replace('controls.enableDamping = !reducedMotion.matches;\n      requestRender();', 'controls.enableDamping = !reducedMotion.matches;\n      canvas.dataset["debugActualYaw"] = String(controls.getAzimuthalAngle());\n      requestRender();')
          p.write_text(s)
          p = Path('scripts/test-twin-browser.mjs')
          s = p.read_text().replace('const results = [];', 'const results = [];\nconst debug = [];')
          s = s.replace('visited.push(Number(await canvas.getAttribute("data-twin-yaw")));', 'visited.push(Number(await canvas.getAttribute("data-twin-yaw")));\n    debug.push(await canvas.evaluate(c => ({...c.dataset, hidden: document.hidden, rect: c.getBoundingClientRect().toJSON()})));')
          s = s.replace('console.log("Orbit samples", JSON.stringify(visited));', 'console.log("Orbit diagnostics", JSON.stringify(debug));\n  await writeFile(path.join(artifacts, "camera-debug.json"), JSON.stringify(debug, null, 2));\n  console.log("Orbit samples", JSON.stringify(visited));')
          p.write_text(s)
          PY
      - run: node scripts/test-twin-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twin-camera-diagnostics
          path: test-results/twin
          retention-days: 1
