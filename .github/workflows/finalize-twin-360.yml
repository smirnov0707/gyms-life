name: Finalize Twin 360 validation
on:
  push:
    branches: [future-lab-phase-3-living-twin-foundation]
    paths: [.github/workflows/finalize-twin-360.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: future-lab-phase-3-living-twin-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --save-dev --save-exact @playwright/test@1.57.0
      - name: Preserve typed light coordinates
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/components/twin/twin-scene.runtime.ts')
          s = p.read_text()
          assert 'light.position.set(...position);' in s
          s = s.replace('light.position.set(...position);', 'light.position.set(position[0], position[1], position[2]);')
          p.write_text(s)
          PY
      - run: npx prettier --write src/components/twin/twin-scene.runtime.ts
      - name: Commit scoped fix and remove this one-off job
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-twin-360.yml
          git add package.json package-lock.json src/components/twin/twin-scene.runtime.ts
          git commit -m "fix(twin): type light positions and use patched Playwright"
          git pull --rebase origin future-lab-phase-3-living-twin-foundation
          git push origin HEAD:future-lab-phase-3-living-twin-foundation
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-twin-browser.mjs
      - name: Capture dependency audit without concealing its result
        if: always()
        run: |
          mkdir -p test-results/twin
          npm audit --json > test-results/twin/dependency-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twin-validation-evidence
          path: test-results/twin
          retention-days: 3
          if-no-files-found: ignore
