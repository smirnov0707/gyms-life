name: Fix progress i18n usage

on:
  push:
    branches:
      - future-lab-phase-2-progress-evolution

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: future-lab-phase-2-progress-evolution
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Retain semantic progress translations
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/progress.tsx')
          s = p.read_text()
          s = s.replace('{copy.title}\n          </h1>', '{t("pr.title")}\n          </h1>')
          s = s.replace('{copy.measured}</p>', '{t("pr.volume")}</p>')
          s = s.replace('<Trophy className="size-4 text-emerald-400" /> {copy.records}', '<Trophy className="size-4 text-emerald-400" /> {t("pr.records")}')
          s = s.replace('<History className="size-4 text-emerald-400" /> {copy.history}', '<History className="size-4 text-emerald-400" /> {t("pr.history")}')
          p.write_text(s)
          PY
      - run: npx prettier --write src/routes/_authenticated/progress.tsx
      - run: npm run typecheck
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/progress.tsx
          git diff --cached --quiet || git commit -m "fix(progress): retain semantic i18n keys"
          git push
