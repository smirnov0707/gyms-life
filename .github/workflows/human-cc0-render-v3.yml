name: Render CC0 GYMS.LIFE digital human v3
on:
  push:
    branches: [future-lab-human-realism-intake]
    paths: [.github/workflows/human-cc0-render-v3.yml]
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN: '34024812573'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Download exact audited human v3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/__human_review
          gh run download "$SOURCE_RUN" --repo "${{ github.repository }}" --name gyms-digital-human-v3-review --dir "$RUNNER_TEMP/human"
          cp "$RUNNER_TEMP/human/gyms-digital-human-v3.glb" public/__human_review/human.glb
      - name: Create isolated Three.js review surface
        run: |
          cat > human-review.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e10}canvas{display:block}</style></head><body><div id="app"></div><script type="module" src="/human-review.js"></script></body></html>
          HTML
          cat > human-review.js <<'JS'
          import * as THREE from 'three';
          import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
          const params=new URLSearchParams(location.search);
          const view=params.get('view')||'front';
          const close=params.get('close')||'';
          const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
          renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(innerWidth,innerHeight);
          renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
          document.querySelector('#app').append(renderer.domElement);
          const scene=new THREE.Scene(); scene.background=new THREE.Color('#0b0e10');
          const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.01,50);
          scene.add(new THREE.HemisphereLight(0xf8f3ec,0x25313a,1.55));
          const key=new THREE.DirectionalLight(0xffead9,3.2); key.position.set(3,4,5); scene.add(key);
          const fill=new THREE.DirectionalLight(0xcfe5ff,1.35); fill.position.set(-4,2,3); scene.add(fill);
          const rim=new THREE.DirectionalLight(0xc8efe4,2.15); rim.position.set(1,3,-5); scene.add(rim);
          const floor=new THREE.Mesh(new THREE.CircleGeometry(2.2,64),new THREE.MeshStandardMaterial({color:0x11171b,roughness:.92,metalness:0})); floor.rotation.x=-Math.PI/2; scene.add(floor);
          const t0=performance.now();
          new GLTFLoader().load('/__human_review/human.glb',g=>{
            const model=g.scene; scene.add(model);
            let meshCount=0, triangles=0, drawCalls=0;
            model.traverse(o=>{ if(o.isMesh){ meshCount++; const geom=o.geometry; const idx=geom.index?.count ?? geom.attributes.position?.count ?? 0; triangles+=Math.floor(idx/3); drawCalls++; const m=o.material; if(m){m.metalness=Math.min(m.metalness??0,.03); m.roughness=Math.max(m.roughness??.5,.46); m.needsUpdate=true;} } });
            const box=new THREE.Box3().setFromObject(model); const size=box.getSize(new THREE.Vector3()); const center=box.getCenter(new THREE.Vector3());
            model.position.sub(center); model.position.y += size.y/2; floor.position.y=0;
            const H=size.y; const target=new THREE.Vector3(0,H*.52,0); const dist=H*1.55;
            const pos={front:[0,H*.55,dist],back:[0,H*.55,-dist],left:[-dist,H*.55,0],right:[dist,H*.55,0],threeq:[dist*.72,H*.58,dist*.72]};
            let p=pos[view]||pos.front;
            if(close==='face'){p=[0,H*.86,H*.52]; target.set(0,H*.87,0); camera.fov=25; camera.updateProjectionMatrix();}
            if(close==='hands'){p=[H*.53,H*.55,H*.65]; target.set(H*.32,H*.55,0); camera.fov=28; camera.updateProjectionMatrix();}
            camera.position.set(...p); camera.lookAt(target);
            const render=()=>renderer.render(scene,camera); render(); requestAnimationFrame(()=>{render(); window.__HUMAN_REVIEW__={ready:true,loadMs:Math.round(performance.now()-t0),meshCount,triangles,drawCalls,box:[size.x,size.y,size.z]};});
          },undefined,e=>{window.__HUMAN_REVIEW__={ready:false,error:String(e)}});
          addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera)});
          JS
          cat > review-vite.config.mjs <<'JS'
          import { defineConfig } from 'vite';
          export default defineConfig({root:process.cwd(),publicDir:'public',plugins:[],server:{host:'127.0.0.1',port:4178,strictPort:true}});
          JS
      - name: Start isolated Vite and capture actual renders
        run: |
          npx vite --config review-vite.config.mjs > "$RUNNER_TEMP/vite.log" 2>&1 & echo $! > "$RUNNER_TEMP/vite.pid"
          ready=0; for i in {1..45}; do if curl -fsS http://127.0.0.1:4178/human-review.html >/dev/null; then ready=1; break; fi; sleep 1; done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/vite.log"; exit 1; fi
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test'; import fs from 'node:fs';
          const browser=await chromium.launch({headless:true}); const out=process.env.RUNNER_TEMP+'/human-renders'; fs.mkdirSync(out,{recursive:true});
          const views=[['front',''],['back',''],['left',''],['right',''],['threeq',''],['front','face'],['right','hands']]; const metrics=[];
          for(const [view,close] of views){const page=await browser.newPage({viewport:{width:900,height:1200},deviceScaleFactor:1}); const url=`http://127.0.0.1:4178/human-review.html?view=${view}&close=${close}`; await page.goto(url); await page.waitForFunction(()=>window.__HUMAN_REVIEW__?.ready===true,{timeout:30000}); await page.waitForTimeout(250); const m=await page.evaluate(()=>window.__HUMAN_REVIEW__); metrics.push({view,close,...m}); await page.screenshot({path:`${out}/${view}${close?'-'+close:''}.png`}); await page.close();}
          const mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1}); await mobile.goto('http://127.0.0.1:4178/human-review.html?view=threeq'); await mobile.waitForFunction(()=>window.__HUMAN_REVIEW__?.ready===true,{timeout:30000}); await mobile.waitForTimeout(200); await mobile.screenshot({path:`${out}/mobile-390.png`}); metrics.push({mobile390:await mobile.evaluate(()=>window.__HUMAN_REVIEW__)}); await browser.close(); fs.writeFileSync(`${out}/metrics.json`,JSON.stringify(metrics,null,2)); console.log(JSON.stringify(metrics,null,2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: gyms-digital-human-v3-renders
          path: ${{ runner.temp }}/human-renders
          retention-days: 3
          if-no-files-found: error
