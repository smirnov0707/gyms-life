name: Public pages browser
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/public-browser/**"
      - "scripts/test-public-*.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/public-browser.yml"
      - ".github/playwright-image.json"
      - "scripts/verify-ci-browser-runtime.mjs"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/public-browser/**"
      - "scripts/test-public-*.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/public-browser.yml"
      - ".github/playwright-image.json"
      - "scripts/verify-ci-browser-runtime.mjs"
permissions:
  contents: read
concurrency:
  group: public-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-ci-browser-runtime.mjs
      - run: npm run test:browser:public
        env:
          CORE_BROWSER_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-${{ matrix.engine }}-evidence
          path: test-results/public-browser
          retention-days: 14
          if-no-files-found: error
