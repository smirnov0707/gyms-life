name: Twin browser
on:
  pull_request:
    paths:
      - "src/components/AppShell.tsx"
      - "src/components/twin/**"
      - "src/components/TwinView.tsx"
      - "src/components/ui/**"
      - "src/ui-design-system.css"
      - "src/components/future-lab-*.css"
      - "public/models/**"
      - "src/lib/digital-twin*"
      - "src/styles.css"
      - "tests/twin-browser/**"
      - "scripts/test-twin-*.mjs"
      - "package*.json"
      - ".github/workflows/twin-browser.yml"
      - ".github/playwright-image.json"
      - "scripts/verify-ci-browser-runtime.mjs"
  push:
    branches: [main]
    paths:
      - "src/components/AppShell.tsx"
      - "src/components/twin/**"
      - "src/components/TwinView.tsx"
      - "src/components/ui/**"
      - "src/ui-design-system.css"
      - "src/components/future-lab-*.css"
      - "public/models/**"
      - "src/lib/digital-twin*"
      - "src/styles.css"
      - "tests/twin-browser/**"
      - "scripts/test-twin-*.mjs"
      - "package*.json"
      - ".github/workflows/twin-browser.yml"
      - ".github/playwright-image.json"
      - "scripts/verify-ci-browser-runtime.mjs"
permissions:
  contents: read
concurrency:
  group: twin-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-ci-browser-runtime.mjs
      - run: node scripts/test-twin-browser.mjs
      - name: Verify visible skin and selection in the real WebGL scene
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/twin-skin
          node scripts/test-twin-skin-browser.mjs 2>&1 | tee test-results/twin-skin/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twin-browser-evidence
          path: test-results/twin
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twin-skin-clarity-evidence
          path: test-results/twin-skin
          retention-days: 14
          if-no-files-found: error
