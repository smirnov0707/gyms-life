name: Restructure model transparency

on:
  push:
    branches:
      - future-lab-phase-2-model-transparency

permissions:
  contents: write

jobs:
  restructure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: future-lab-phase-2-model-transparency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restructure presentation only
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/routes/_authenticated/me.tsx')
          text = path.read_text()

          metric_start = text.index('function Metric(')
          page_start = text.index('function AthleteModelPage()', metric_start)
          new_metric = '''function Metric({ label, value }: { label: string; value: string }) {
            return (
              <div className="flex items-end justify-between gap-4 border-b border-white/[0.05] py-2.5 last:border-b-0">
                <p className="text-[10px] font-bold uppercase tracking-[0.14em] text-neutral-600">{label}</p>
                <p className="shrink-0 font-mono text-sm text-neutral-300">{value}</p>
              </div>
            );
          }

          '''
          text = text[:metric_start] + new_metric + text[page_start:]

          marker = '  return (\n    <div className="mx-auto grid max-w-5xl gap-6">'
          return_start = text.index(marker, text.index('function AthleteModelPage()'))
          function_end = text.rfind('\n  );\n}') + len('\n  );\n}')

          new_return = '''  const english = baseLang(lang) === "en";
            const ui = english
              ? {
                  trust: "MODEL TRANSPARENCY",
                  knows: "What GYMS.LIFE currently knows",
                  knowsSub: "Only active facts and patterns that the system is allowed to use.",
                  needs: "What would make the model stronger",
                  inspect: "Inspect deterministic measurements",
                  inspectSub: "Aggregated training, recovery, body and nutrition facts behind the model.",
                  rhythm: "Inspect training rhythm",
                  controls: "Evidence & controls",
                  modelState: "Model state",
                  snapshot: "Last deterministic snapshot",
                }
              : {
                  trust: "MODELIO SKAIDRUMAS",
                  knows: "Ką GYMS.LIFE šiuo metu žino",
                  knowsSub: "Tik aktyvūs faktai ir dėsningumai, kuriuos sistemai leidžiama naudoti.",
                  needs: "Kas sustiprintų modelį",
                  inspect: "Peržiūrėti deterministinius rodiklius",
                  inspectSub: "Agreguoti treniruočių, atsistatymo, kūno ir mitybos faktai, kuriais remiasi modelis.",
                  rhythm: "Peržiūrėti treniruočių ritmą",
                  controls: "Įrodymai ir valdymas",
                  modelState: "Modelio būsena",
                  snapshot: "Paskutinė deterministinė būsena",
                };

            return (
              <div className="mx-auto max-w-5xl space-y-4">
                <section className="relative overflow-hidden rounded-[2rem] border border-white/[0.07] bg-[#050706] p-5 sm:p-7">
                  <div
                    aria-hidden="true"
                    className="pointer-events-none absolute inset-0"
                    style={{
                      background:
                        "radial-gradient(65% 110% at 0% 0%, rgba(16,185,129,.10), transparent 62%)",
                    }}
                  />
                  <div className="relative flex flex-col gap-6 lg:flex-row lg:items-end lg:justify-between">
                    <div className="max-w-2xl">
                      <p className="text-[10px] font-bold uppercase tracking-[0.28em] text-emerald-400">
                        {ui.trust}
                      </p>
                      <h1 className="mt-2 text-3xl font-semibold tracking-tight text-white sm:text-4xl">
                        {copy.title}
                      </h1>
                      <p className="mt-2 max-w-xl text-sm leading-relaxed text-neutral-500">
                        {copy.description}
                      </p>
                    </div>
                    <Button
                      onClick={() => void load()}
                      disabled={loading}
                      variant="ghost"
                      size="sm"
                      className="self-start text-neutral-500 hover:text-white lg:self-auto"
                    >
                      {loading ? (
                        <Loader2 className="size-4 animate-spin" />
                      ) : (
                        <RefreshCw className="size-4" />
                      )}
                      {copy.refresh}
                    </Button>
                  </div>

                  {loading && !state ? (
                    <div className="relative mt-7 flex items-center gap-2 text-sm text-neutral-500">
                      <Loader2 className="size-4 animate-spin text-emerald-400" /> {copy.updating}
                    </div>
                  ) : null}

                  {state ? (
                    <div className="relative mt-7 grid gap-5 border-t border-white/[0.06] pt-6 sm:grid-cols-[1fr_auto] sm:items-end">
                      <div className="flex items-start gap-3">
                        <span className="grid size-10 shrink-0 place-items-center rounded-xl border border-emerald-400/20 bg-emerald-400/[0.06] text-emerald-400">
                          <ShieldCheck className="size-4" />
                        </span>
                        <div>
                          <p className="text-[9px] font-bold uppercase tracking-[0.18em] text-neutral-600">
                            {ui.modelState}
                          </p>
                          <p className="mt-1 text-lg font-medium text-white">
                            {copy.quality[state.dataQuality.level]}
                          </p>
                          <p className="mt-1 text-xs leading-relaxed text-neutral-500">
                            {state.dataQuality.evidenceCount} {copy.evidence} · {copy.transparent}
                          </p>
                        </div>
                      </div>
                      <div className="font-mono text-[10px] text-neutral-600">
                        {model?.snapshot
                          ? `${ui.snapshot}: ${new Date(model.snapshot.computedAt).toLocaleString(locale)}`
                          : copy.unavailable}
                      </div>
                    </div>
                  ) : null}
                </section>

                <section className="rounded-[1.75rem] border border-white/[0.07] bg-white/[0.02] p-5 sm:p-6">
                  <div>
                    <p className="flex items-center gap-2 text-[10px] font-bold uppercase tracking-[0.2em] text-emerald-400">
                      <Brain className="size-4" /> {copy.memory.eyebrow}
                    </p>
                    <h2 className="mt-2 text-2xl font-semibold tracking-tight text-white">{ui.knows}</h2>
                    <p className="mt-1 text-sm leading-relaxed text-neutral-500">{ui.knowsSub}</p>
                  </div>

                  {memoryLoading ? (
                    <div className="mt-6 flex items-center gap-2 text-sm text-neutral-500">
                      <Loader2 className="size-4 animate-spin text-emerald-400" /> {copy.memory.loading}
                    </div>
                  ) : memories.length === 0 ? (
                    <p className="mt-6 text-sm leading-relaxed text-neutral-500">{copy.memory.empty}</p>
                  ) : (
                    <div className="mt-5 divide-y divide-white/[0.06]">
                      {memories.map((memory) => {
                        const correctPending = pendingMemoryAction === `correct:${memory.id}`;
                        const incorrectPending = pendingMemoryAction === `incorrect:${memory.id}`;
                        const forgetPending = pendingMemoryAction === `forget:${memory.id}`;
                        const isEditing = editingMemoryId === memory.id;
                        const displayedContent = displayedMemoryContent(memory, lang);
                        const evidenceSummary = memoryEvidenceSummary(memory, lang);
                        const correctionInvalid =
                          correctedContent.trim().length === 0 || correctedContent.trim().length > 400;

                        return (
                          <details key={memory.id} className="group py-4">
                            <summary className="cursor-pointer list-none">
                              <div className="flex items-start justify-between gap-4">
                                <div className="min-w-0">
                                  <div className="flex flex-wrap items-center gap-2">
                                    <span className="text-[9px] font-bold uppercase tracking-[0.16em] text-emerald-400">
                                      {memoryTypeLabel(memory.type, lang)}
                                    </span>
                                    <span className="text-[9px] font-bold uppercase tracking-[0.12em] text-neutral-600">
                                      {copy.memory.evidenceStateLabel[memory.evidenceState]}
                                    </span>
                                  </div>
                                  <p className="mt-2 text-sm font-medium leading-relaxed text-neutral-200">
                                    {displayedContent}
                                  </p>
                                </div>
                                <span className="mt-1 shrink-0 text-[10px] uppercase tracking-[0.14em] text-neutral-600 group-open:text-neutral-400">
                                  {ui.controls}
                                </span>
                              </div>
                            </summary>

                            <div className="mt-4 rounded-2xl border border-white/[0.06] bg-black/20 p-4">
                              <p className="flex items-start gap-2 text-xs leading-relaxed text-neutral-500">
                                <Info className="mt-0.5 size-3.5 shrink-0" />
                                {evidenceSummary ?? copy.memory.evidence(memory.evidenceCount)}
                              </p>
                              <dl className="mt-4 grid gap-x-6 gap-y-3 text-xs sm:grid-cols-2">
                                <div>
                                  <dt className="text-neutral-600">{copy.memory.source}</dt>
                                  <dd className="mt-0.5 text-neutral-300">
                                    {memorySourceLabel(memory.source, lang)}
                                  </dd>
                                </div>
                                <div>
                                  <dt className="text-neutral-600">{copy.memory.evidenceState}</dt>
                                  <dd className="mt-0.5 text-neutral-300">
                                    {copy.memory.evidenceStateLabel[memory.evidenceState]}
                                  </dd>
                                </div>
                                <div>
                                  <dt className="text-neutral-600">{copy.memory.lastConfirmed}</dt>
                                  <dd className="mt-0.5 text-neutral-300">
                                    {new Date(memory.lastConfirmedAt).toLocaleDateString(locale)}
                                  </dd>
                                </div>
                                {memory.expiresAt ? (
                                  <div>
                                    <dt className="text-neutral-600">{copy.memory.expires}</dt>
                                    <dd className="mt-0.5 text-neutral-300">
                                      {new Date(memory.expiresAt).toLocaleString(locale)}
                                    </dd>
                                  </div>
                                ) : null}
                              </dl>

                              <div className="mt-4 flex flex-wrap gap-2 border-t border-white/[0.05] pt-4">
                                {memory.type === "current_context" ? (
                                  <Button asChild size="sm" variant="outline" className="rounded-full">
                                    <Link to="/">{copy.memory.updateContext}</Link>
                                  </Button>
                                ) : (
                                  <>
                                    <Button
                                      type="button"
                                      size="sm"
                                      variant="outline"
                                      className="rounded-full"
                                      disabled={pendingMemoryAction !== null}
                                      onClick={() => {
                                        setEditingMemoryId(isEditing ? null : memory.id);
                                        setCorrectedContent(isEditing ? "" : displayedContent);
                                      }}
                                    >
                                      <Pencil /> {copy.memory.correct}
                                    </Button>
                                    <Button
                                      type="button"
                                      size="sm"
                                      variant="outline"
                                      className="rounded-full"
                                      disabled={pendingMemoryAction !== null}
                                      onClick={() => void changeMemory(memory.id, "incorrect")}
                                    >
                                      {incorrectPending ? (
                                        <Loader2 className="animate-spin" />
                                      ) : (
                                        <ThumbsDown />
                                      )}
                                      {copy.memory.incorrect}
                                    </Button>
                                  </>
                                )}
                                <Button
                                  type="button"
                                  size="sm"
                                  variant="ghost"
                                  className="rounded-full text-neutral-500 hover:text-destructive"
                                  disabled={pendingMemoryAction !== null}
                                  onClick={() => void changeMemory(memory.id, "forget")}
                                >
                                  {forgetPending ? <Loader2 className="animate-spin" /> : <Trash2 />}
                                  {copy.memory.forget}
                                </Button>
                              </div>

                              {isEditing ? (
                                <div className="mt-4 border-t border-white/[0.05] pt-4">
                                  <label
                                    className="text-sm font-semibold text-neutral-200"
                                    htmlFor={`memory-correction-${memory.id}`}
                                  >
                                    {copy.memory.correctionLabel}
                                  </label>
                                  <p className="mt-1 text-xs leading-relaxed text-neutral-500">
                                    {copy.memory.correctionHint}
                                  </p>
                                  <Input
                                    id={`memory-correction-${memory.id}`}
                                    value={correctedContent}
                                    maxLength={400}
                                    className="mt-3 border-white/[0.08] bg-white/[0.025]"
                                    onChange={(event) => setCorrectedContent(event.target.value)}
                                  />
                                  <div className="mt-3 flex flex-wrap gap-2">
                                    <Button
                                      type="button"
                                      size="sm"
                                      className="rounded-full"
                                      disabled={pendingMemoryAction !== null || correctionInvalid}
                                      onClick={() => void submitMemoryCorrection(memory)}
                                    >
                                      {correctPending ? (
                                        <Loader2 className="animate-spin" />
                                      ) : (
                                        <Pencil />
                                      )}
                                      {copy.memory.saveCorrection}
                                    </Button>
                                    <Button
                                      type="button"
                                      size="sm"
                                      variant="ghost"
                                      className="rounded-full"
                                      disabled={pendingMemoryAction !== null}
                                      onClick={() => {
                                        setEditingMemoryId(null);
                                        setCorrectedContent("");
                                      }}
                                    >
                                      {copy.memory.cancel}
                                    </Button>
                                  </div>
                                </div>
                              ) : null}
                            </div>
                          </details>
                        );
                      })}
                    </div>
                  )}
                </section>

                {state ? (
                  <section className="rounded-[1.75rem] border border-white/[0.07] bg-white/[0.02] p-5 sm:p-6">
                    <p className="text-[10px] font-bold uppercase tracking-[0.2em] text-neutral-600">
                      {ui.needs}
                    </p>
                    {state.dataGaps.length ? (
                      <div className="mt-3 flex flex-wrap gap-2">
                        {state.dataGaps.map((gap) => {
                          const action = dataGapAction(gap, lang);
                          return (
                            <Button key={gap} asChild size="sm" variant="outline" className="rounded-full">
                              <Link to={action.to}>{action.label}</Link>
                            </Button>
                          );
                        })}
                      </div>
                    ) : (
                      <p className="mt-2 text-sm text-neutral-500">{copy.noGaps}</p>
                    )}
                  </section>
                ) : null}

                {state ? (
                  <details className="rounded-[1.75rem] border border-white/[0.07] bg-white/[0.015]">
                    <summary className="cursor-pointer list-none px-5 py-4 sm:px-6">
                      <p className="text-sm font-semibold text-white">{ui.inspect}</p>
                      <p className="mt-1 text-xs leading-relaxed text-neutral-600">{ui.inspectSub}</p>
                    </summary>
                    <div className="grid border-t border-white/[0.06] md:grid-cols-2">
                      <div className="p-5 sm:p-6 md:border-r md:border-white/[0.06]">
                        <h3 className="flex items-center gap-2 text-sm font-semibold text-neutral-300">
                          <Dumbbell className="size-4 text-emerald-400" /> {copy.training}
                        </h3>
                        <div className="mt-3">
                          <Metric label={copy.sessions7d} value={String(state.training.sessionsLast7Days)} />
                          <Metric label={copy.sessions28d} value={String(state.training.sessionsLast28Days)} />
                          <Metric label={copy.volume} value={`${Math.round(state.training.totalVolumeLast28Days)} kg`} />
                          <Metric label={copy.daysSince} value={numberOrDash(state.training.daysSinceLastCompletedWorkout)} />
                          <Metric
                            label={copy.sessionRatings}
                            value={state.training.selfReportedResponse.available ? String(state.training.selfReportedResponse.ratedSessionsLast28Days) : "—"}
                          />
                          <Metric
                            label={copy.averageSessionFeeling}
                            value={state.training.selfReportedResponse.available ? numberOrDash(state.training.selfReportedResponse.averageFeelingLast28Days, " / 5") : "—"}
                          />
                          <Metric
                            label={copy.difficultSessionStreak}
                            value={state.training.selfReportedResponse.available ? String(state.training.selfReportedResponse.recentLowFeelingStreak) : "—"}
                          />
                        </div>
                      </div>
                      <div className="grid sm:grid-cols-3 md:grid-cols-1">
                        <div className="p-5 sm:p-6">
                          <h3 className="flex items-center gap-2 text-sm font-semibold text-neutral-300">
                            <HeartPulse className="size-4 text-emerald-400" /> {copy.recovery}
                          </h3>
                          <div className="mt-3">
                            <Metric label={copy.readiness} value={numberOrDash(state.recovery.latestReadinessScore, "/100")} />
                            <Metric label={copy.sleep} value={numberOrDash(state.recovery.averageSleepHoursLast7Days, " h")} />
                          </div>
                        </div>
                        <div className="border-t border-white/[0.05] p-5 sm:p-6 sm:border-l sm:border-t-0 md:border-l-0 md:border-t">
                          <h3 className="flex items-center gap-2 text-sm font-semibold text-neutral-300">
                            <Scale className="size-4 text-emerald-400" /> {copy.body}
                          </h3>
                          <div className="mt-3">
                            <Metric label={copy.weight} value={numberOrDash(state.body.latestWeightKg, " kg")} />
                            <Metric label={copy.weightTrend} value={numberOrDash(state.body.weightChangeKgLast30Days, " kg")} />
                          </div>
                        </div>
                        <div className="border-t border-white/[0.05] p-5 sm:p-6 sm:border-l sm:border-t-0 md:border-l-0 md:border-t">
                          <h3 className="flex items-center gap-2 text-sm font-semibold text-neutral-300">
                            <Apple className="size-4 text-emerald-400" /> {copy.nutrition}
                          </h3>
                          <div className="mt-3">
                            <Metric label={copy.loggedDays} value={String(state.nutrition.loggedDaysLast14Days)} />
                            <Metric label={copy.calories} value={numberOrDash(state.nutrition.averageCaloriesOnLoggedDays)} />
                            <Metric label={copy.protein} value={numberOrDash(state.nutrition.averageProteinGOnLoggedDays, " g")} />
                          </div>
                        </div>
                      </div>
                    </div>
                  </details>
                ) : null}

                <details className="rounded-[1.75rem] border border-white/[0.07] bg-white/[0.015]">
                  <summary className="cursor-pointer list-none px-5 py-4 text-sm font-semibold text-white sm:px-6">
                    {ui.rhythm}
                  </summary>
                  <div className="border-t border-white/[0.06] p-4 sm:p-5">
                    <TrainingRhythmCard />
                  </div>
                </details>
              </div>
            );
          }'''

          text = text[:return_start] + new_return + text[function_end:]
          path.write_text(text)
          PY
      - run: npx prettier --write src/routes/_authenticated/me.tsx
      - run: npm run typecheck
      - name: Commit model transparency surface
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/me.tsx
          git commit -m "feat(model): make transparency the primary athlete-model surface"
          git push
