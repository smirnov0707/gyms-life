name: Offline identity browser
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/offline-browser/**"
      - "scripts/test-offline-browser.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/offline-browser.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/offline-browser/**"
      - "scripts/test-offline-browser.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/offline-browser.yml"
permissions:
  contents: read
concurrency:
  group: offline-identity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Real IndexedDB, multi-tab and authentication state integration
        run: npm run test:browser:offline
        env:
          CORE_BROWSER_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-${{ matrix.engine }}-evidence
          path: test-results/offline-browser
          retention-days: 14
          if-no-files-found: error
