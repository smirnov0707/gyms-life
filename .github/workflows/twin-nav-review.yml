name: Twin navigation diagnostic review
on:
  push:
    branches: [diagnostics/twin-navigation-source-2026-10-08]
    paths: [.github/workflows/twin-nav-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 299a9bc935de265e993d5531ac98dc2439d7cc54
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 11572172842
          run-id: 37827862373
          github-token: ${{ github.token }}
          path: /tmp/twin-evidence
      - name: Compare retained failed diagnostic source with the current PR
        shell: bash
        run: |
          python3 <<'PY'
          import difflib,json
          from pathlib import Path
          root=Path('/tmp/twin-evidence'); names=[p for p in root.rglob('*') if p.is_file()]
          print('EVIDENCE_FILES',json.dumps([str(p.relative_to(root)) for p in names]))
          out=Path('test-results/navigation-review');out.mkdir(parents=True,exist_ok=True)
          for path in ['scripts/test-twin-camera-navigation.mjs','src/components/twin/twin-scene.runtime.ts','src/components/twin/twin-camera.navigation.ts','src/components/twin/BodySceneStage.tsx','src/components/twin/twin-camera-navigation.css','tests/twin-browser/navigation-fixture.tsx']:
              matches=[p for p in names if str(p).endswith('/'+path)]
              if len(matches)!=1:
                  print('SOURCE_NOT_UNIQUE',path,[str(p) for p in matches]);continue
              candidate=matches[0].read_text();current=Path(path).read_text()
              diff=''.join(difflib.unified_diff(current.splitlines(True),candidate.splitlines(True),fromfile='PR151/'+path,tofile='diagnostic/'+path))
              print('SOURCE_DIFF',path,'\n'+diff[:35000])
              if path.endswith('test-twin-camera-navigation.mjs'):
                  print('PICKING_TEST_LINES','\n'.join(f'{i+1}: {line}' for i,line in enumerate(candidate.splitlines()) if 145<=i<=250))
              (out/(Path(path).name+'.diff.txt')).write_text(diff)
          for p in names:
              if p.name=='failure.json' or p.name.endswith('-failure.json') or (p.name=='results.json' and 'twin-navigation/' in str(p)):
                  print('DIAGNOSTIC_RESULT',str(p.relative_to(root)),p.read_text()[:30000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: twin-navigation-source-review
          path: test-results/navigation-review
          retention-days: 14
          if-no-files-found: error
