name: Phase 2 cleanup

on:
  push:
    branches:
      - future-lab-phase-2

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: future-lab-phase-2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove translations retired with the Today dashboard tail
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/lib/i18n.tsx';
          let text = fs.readFileSync(path, 'utf8');
          const keys = [
            'landing.cmd.todaySession',
            'landing.cmd.nextMeal',
            'dash.week',
            'dash.noplan',
            'dash.noplanCta',
            'plan.exercises',
          ];
          for (const key of keys) {
            const escaped = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const pattern = new RegExp(`^\\s*"${escaped}":\\s*\\{[^\\n]*\\},\\n`, 'm');
            if (!pattern.test(text)) throw new Error(`Expected one-line base key not found: ${key}`);
            text = text.replace(pattern, '');
          }
          fs.writeFileSync(path, text);
          NODE
      - name: Format changed Future Lab UI files
        run: npx prettier --write src/components/Overview.tsx src/components/twin/TwinTodayCard.tsx src/lib/i18n.tsx
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Overview.tsx src/components/twin/TwinTodayCard.tsx src/lib/i18n.tsx
          git commit -m "refactor(today): retire dashboard-only translation copy"
          git push
