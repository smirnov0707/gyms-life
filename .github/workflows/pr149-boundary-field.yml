jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init
    env:
      CANDIDATE_PARENT: f74861f5875bb93ba5ef248c608570b642fa5679
      REVIEWED_MAIN: 3967daa8504ba53f28b60d913235e3020f303981
