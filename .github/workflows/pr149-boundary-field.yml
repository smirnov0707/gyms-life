      - name: Prepare exact-source candidate without changing main or the PR branch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          root=Path.cwd()
          git=lambda *a: subprocess.check_output(['git','-c',f'safe.directory={root}',*a],text=True).strip()
          assert git('rev-parse','HEAD')=='f74861f5875bb93ba5ef248c608570b642fa5679'
          assert git('rev-parse','HEAD:src/components/twin/twin-human.loader.ts')=='fbf9221569a1169b16a5d90f051f99176711343b'
          assert git('rev-parse','HEAD:src/components/twin/twin-anatomy.material.ts')=='4a8eeb8c199ea1adb7e7aeda3260f1c61c83ac8e'
          files={}
          files['src/components/twin/twin-region-boundary.ts']=r'''import { DataTexture, LinearFilter, RedFormat, Vector4, type BufferGeometry } from "three";

          /** Graphic transition on the metre-scale generic mesh, not an anatomical measurement. */
          export const TWIN_BACK_FEATHER_METRES = 0.025;
          const SIZE = 256;
          export type TwinBoundaryField = { texture: DataTexture; bounds: Vector4 };

          const smooth = (low: number, high: number, value: number) => {
            const t = Math.max(0, Math.min(1, (value - low) / (high - low)));
            return t * t * (3 - 2 * t);
          };
          const clampPixel = (value: number) => Math.max(0, Math.min(SIZE - 1, value));

          /** Separable, bounded Gaussian smoothing of a graphic distance field. */
          function blur(input: Float32Array, sigma: number, horizontal: boolean): Float32Array {
            const radius = Math.min(24, Math.max(1, Math.ceil(3 * sigma)));
            const weights: number[] = [];
            let sum = 0;
            for (let k = -radius; k <= radius; k++) {
              const weight = Math.exp(-(k * k) / (2 * sigma * sigma));
              weights.push(weight); sum += weight;
            }
            const result = new Float32Array(SIZE * SIZE);
            for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
              let value = 0;
              for (let k = -radius; k <= radius; k++) {
                const sample = horizontal ? y * SIZE + clampPixel(x + k) : clampPixel(y + k) * SIZE + x;
                value += input[sample]! * weights[k + radius]!;
              }
              result[y * SIZE + x] = value / sum;
            }
            return result;
          }

          /**
           * Only for the verified posterior Body surface: rasterize its existing
           * XY triangle footprint and smooth the signed interior distance. The
           * fragment shader samples the result, independent of coarse vertices.
           * No position, topology, normal, UV or picking mutation. One 64KiB R8
           * texture, no extra mesh/draw call and no per-frame CPU calculation.
           */
          export function createTwinBoundaryField(
            geometry: BufferGeometry, width = TWIN_BACK_FEATHER_METRES,
          ): TwinBoundaryField {
            if (!Number.isFinite(width) || width < 0.001 || width > 0.1)
              throw new Error("TWIN_BOUNDARY_WIDTH_INVALID");
            const p = geometry.getAttribute("position");
            const index = geometry.getIndex();
            if (!p || p.itemSize !== 3 || p.count < 3 || p.count > 65536)
              throw new Error("TWIN_BOUNDARY_POSITIONS_INVALID");
            const count = index?.count ?? p.count;
            if (count < 3 || count % 3 !== 0 || count > 196608)
              throw new Error("TWIN_BOUNDARY_TRIANGLES_INVALID");
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            for (let i = 0; i < p.count; i++) {
              const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
              if (![x, y, z].every((v) => Number.isFinite(v) && Math.abs(v) <= 10))
                throw new Error("TWIN_BOUNDARY_POSITION_INVALID");
              minX = Math.min(minX, x); maxX = Math.max(maxX, x);
              minY = Math.min(minY, y); maxY = Math.max(maxY, y);
            }
            if (maxX <= minX || maxY <= minY) throw new Error("TWIN_BOUNDARY_PROJECTION_EMPTY");
            minX -= width * 2; minY -= width * 2;
            maxX += width * 2; maxY += width * 2;
            const sx = (maxX - minX) / SIZE, sy = (maxY - minY) / SIZE;
            const inside = new Uint8Array(SIZE * SIZE);
            const edge = (a: [number, number], b: [number, number], x: number, y: number) =>
              (b[0] - a[0]) * (y - a[1]) - (b[1] - a[1]) * (x - a[0]);
            for (let i = 0; i < count; i += 3) {
              const points = [0, 1, 2].map((corner): [number, number] => {
                const vertex = index ? index.getX(i + corner) : i + corner;
                if (!Number.isInteger(vertex) || vertex < 0 || vertex >= p.count)
                  throw new Error("TWIN_BOUNDARY_INDEX_INVALID");
                return [(p.getX(vertex) - minX) / sx, (p.getY(vertex) - minY) / sy];
              });
              const a = points[0]!, b = points[1]!, c = points[2]!;
              if (Math.abs(edge(a, b, c[0], c[1])) < 1e-10) continue;
              const left = clampPixel(Math.floor(Math.min(a[0], b[0], c[0])));
              const right = clampPixel(Math.ceil(Math.max(a[0], b[0], c[0])));
              const bottom = clampPixel(Math.floor(Math.min(a[1], b[1], c[1])));
              const top = clampPixel(Math.ceil(Math.max(a[1], b[1], c[1])));
              for (let y = bottom; y <= top; y++) for (let x = left; x <= right; x++) {
                const u = edge(a, b, x + 0.5, y + 0.5);
                const v = edge(b, c, x + 0.5, y + 0.5);
                const w = edge(c, a, x + 0.5, y + 0.5);
                if ((u >= -1e-8 && v >= -1e-8 && w >= -1e-8) ||
                    (u <= 1e-8 && v <= 1e-8 && w <= 1e-8)) inside[y * SIZE + x] = 1;
              }
            }
            if (!inside.some((value) => value === 1)) throw new Error("TWIN_BOUNDARY_PROJECTION_EMPTY");
            // Two-pass eight-neighbour chamfer distance, not a body measurement.
            const distance = new Float32Array(SIZE * SIZE).fill(width * 2);
            for (let y = 1; y < SIZE - 1; y++) for (let x = 1; x < SIZE - 1; x++) {
              const at = y * SIZE + x;
              if ([at - 1, at + 1, at - SIZE, at + SIZE].some((n) => inside[n] !== inside[at])) distance[at] = 0;
            }
            const diagonal = Math.hypot(sx, sy);
            for (let y = 1; y < SIZE - 1; y++) for (let x = 1; x < SIZE - 1; x++) {
              const at = y * SIZE + x;
              distance[at] = Math.min(distance[at]!, distance[at - 1]! + sx, distance[at - SIZE]! + sy,
                distance[at - SIZE - 1]! + diagonal, distance[at - SIZE + 1]! + diagonal);
            }
            for (let y = SIZE - 2; y > 0; y--) for (let x = SIZE - 2; x > 0; x--) {
              const at = y * SIZE + x;
              distance[at] = Math.min(distance[at]!, distance[at + 1]! + sx, distance[at + SIZE]! + sy,
                distance[at + SIZE - 1]! + diagonal, distance[at + SIZE + 1]! + diagonal);
            }
            const signed = new Float32Array(distance.length);
            for (let i = 0; i < distance.length; i++) signed[i] = inside[i] ? distance[i]! : -distance[i]!;
            const softened = blur(blur(signed, width * 0.22 / sx, true), width * 0.22 / sy, false);
            const bytes = new Uint8Array(SIZE * SIZE);
            for (let i = 0; i < bytes.length; i++) {
              // The second term keeps the original footprint border neutral.
              bytes[i] = inside[i] ? Math.round(255 * smooth(width * 0.16, width * 0.8, softened[i]!) *
                smooth(0, width * 0.12, distance[i]!)) : 0;
            }
            const texture = new DataTexture(bytes, SIZE, SIZE, RedFormat);
            texture.minFilter = LinearFilter;
            texture.magFilter = LinearFilter;
            texture.generateMipmaps = false;
            texture.flipY = false;
            texture.needsUpdate = true;
            return { texture, bounds: new Vector4(minX, minY, maxX - minX, maxY - minY) };
          }
          '''
          files['src/components/twin/twin-boundary.material.ts']=r'''import type { MeshStandardMaterialParameters } from "three";
          import { createTwinAnatomyMaterial } from "./twin-anatomy.material";
          import { TWIN_SKIN_MATERIAL } from "./twin-surface.style";
          import type { TwinBoundaryField } from "./twin-region-boundary";

          const replaceOnce = (source: string, from: string, to: string) => {
            if (source.split(from).length !== 2) throw new Error("TWIN_BOUNDARY_SHADER_CONTRACT");
            return source.replace(from, to);
          };

          /** Owns one field texture; other anatomy material paths stay unchanged. */
          export function createTwinBoundaryMaterial(
            parameters: MeshStandardMaterialParameters, field: TwinBoundaryField,
          ) {
            const material = createTwinAnatomyMaterial(parameters, { regionMask: true });
            const compile = material.onBeforeCompile;
            const cacheKey = material.customProgramCacheKey.bind(material);
            let disposed = false;
            material.addEventListener("dispose", () => {
              if (disposed) return;
              disposed = true;
              field.texture.dispose();
            });
            material.onBeforeCompile = (shader, renderer) => {
              compile.call(material, shader, renderer);
              shader.uniforms["twinBoundaryTexture"] = { value: field.texture };
              shader.uniforms["twinBoundaryBounds"] = { value: field.bounds };
              shader.uniforms["twinBoundaryNeutralRoughness"] = { value: TWIN_SKIN_MATERIAL.roughness };
              shader.vertexShader = replaceOnce(shader.vertexShader, "attribute float _twin_mask;", "uniform vec4 twinBoundaryBounds;");
              shader.vertexShader = replaceOnce(shader.vertexShader, "varying float vTwinMask;", "varying vec2 vTwinBoundaryUv;");
              shader.vertexShader = replaceOnce(shader.vertexShader, "vTwinMask = _twin_mask;", "vTwinBoundaryUv = (position.xy - twinBoundaryBounds.xy) / twinBoundaryBounds.zw;");
              shader.fragmentShader = replaceOnce(shader.fragmentShader, "varying float vTwinMask;", "varying vec2 vTwinBoundaryUv;\nuniform sampler2D twinBoundaryTexture;\nuniform float twinBoundaryNeutralRoughness;");
              shader.fragmentShader = replaceOnce(shader.fragmentShader, "clamp(vTwinMask, 0.0, 1.0)", "texture2D(twinBoundaryTexture, vTwinBoundaryUv).r");
              shader.fragmentShader = replaceOnce(shader.fragmentShader, "#include <roughnessmap_fragment>", "#include <roughnessmap_fragment>\nroughnessFactor = mix(twinBoundaryNeutralRoughness, roughnessFactor, twinSurfaceMask);");
            };
            material.customProgramCacheKey = () => cacheKey() + "-boundary-field-v1";
            return material;
          }
          '''
          files['src/components/twin/twin-region-boundary.test.ts']=r'''import { readFileSync } from "node:fs";
          import { performance } from "node:perf_hooks";
          import { afterEach, describe, expect, it, vi } from "vitest";
          import { BufferGeometry, Float32BufferAttribute, Mesh, PlaneGeometry, ShaderLib, type WebGLRenderer } from "three";
          import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
          import { createTwinBoundaryField } from "./twin-region-boundary";
          import { createTwinBoundaryMaterial } from "./twin-boundary.material";
          import { loadTwinHuman } from "./twin-human.loader";
          import { TWIN_SKIN_MATERIAL } from "./twin-surface.style";

          afterEach(() => vi.unstubAllGlobals());
          const buffer = (file: string) => new Uint8Array(readFileSync(file)).buffer;
          const attributes = (geometry: BufferGeometry) => Object.fromEntries(
            Object.entries(geometry.attributes).map(([name, attr]) => [name, Array.from(attr.array)]),
          );
          describe("per-fragment posterior boundary field", () => {
            it("preserves every source position, normal, UV and triangle index", () => {
              const g = new PlaneGeometry(0.2, 0.2, 8, 8), before = attributes(g), index = Array.from(g.index!.array);
              const field = createTwinBoundaryField(g);
              expect(attributes(g)).toEqual(before); expect(Array.from(g.index!.array)).toEqual(index);
              expect(g.getAttribute("_twin_mask")).toBeUndefined(); field.texture.dispose();
            });
            it("uses one bounded non-colour R8 field with a solid interior and neutral exterior", () => {
              const f = createTwinBoundaryField(new PlaneGeometry(0.2, 0.2, 8, 8));
              const data = f.texture.image.data;
              expect(data).toBeInstanceOf(Uint8Array);
              expect(data.byteLength).toBe(65536);
              expect(f.texture.image.width).toBe(256); expect(f.texture.image.height).toBe(256);
              expect(f.texture.colorSpace).toBe(""); expect(f.texture.generateMipmaps).toBe(false);
              expect(data[128 * 256 + 128]).toBe(255); expect(data[0]).toBe(0);
              expect(Array.from(data).some((x) => x > 0 && x < 255)).toBe(true); f.texture.dispose();
            });
            it("gives identical fields for indexed and unindexed/UV-seamed geometry", () => {
              const g = new PlaneGeometry(0.2, 0.2, 8, 8);
              const a = createTwinBoundaryField(g), b = createTwinBoundaryField(g.toNonIndexed());
              expect(a.texture.image.data).toEqual(b.texture.image.data);
              a.texture.dispose(); b.texture.dispose();
            });
            it.each([0, -0.1, NaN, Infinity, 0.2, 1e-9])("rejects invalid width %s", (width) => {
              expect(() => createTwinBoundaryField(new PlaneGeometry(), width)).toThrow("WIDTH_INVALID");
            });
            it("rejects invalid indices without changing the input", () => {
              const g = new PlaneGeometry(0.2, 0.2, 2, 2); g.setIndex([0, 1, 100]);
              expect(() => createTwinBoundaryField(g)).toThrow("INDEX_INVALID");
              expect(Array.from(g.index!.array)).toEqual([0, 1, 100]);
            });
            it("rejects nonfinite positions and empty projections", () => {
              const g = new BufferGeometry();
              g.setAttribute("position", new Float32BufferAttribute([0,0,0,0,0,0,1,0,0],3));
              expect(() => createTwinBoundaryField(g)).toThrow("PROJECTION_EMPTY");
              g.getAttribute("position").setX(0, NaN);
              expect(() => createTwinBoundaryField(g)).toThrow("POSITION_INVALID");
            });
            it("preserves the exact registered back and keeps a substantial interior", async () => {
              const gltf = await new GLTFLoader().parseAsync(buffer("public/models/twin-body-v2.glb"), "");
              const back: Mesh[] = [];
              gltf.scene.traverse((object) => {
                if (object instanceof Mesh && !Array.isArray(object.material) && object.material.name === "twin-region:back") back.push(object);
              });
              expect(back).toHaveLength(1);
              const g = back[0]!.geometry, before = attributes(g), indices = Array.from(g.index!.array);
              const started = performance.now(), field = createTwinBoundaryField(g);
              const bytes = Array.from(field.texture.image.data);
              console.log("Boundary field CPU", { milliseconds: performance.now() - started, bytes: bytes.length, solid: bytes.filter((v) => v === 255).length });
              expect(bytes.filter((v) => v === 255).length).toBeGreaterThan(1000);
              expect(bytes.filter((v) => v === 0).length).toBeGreaterThan(1000);
              expect(attributes(g)).toEqual(before); expect(Array.from(g.index!.array)).toEqual(indices);
              field.texture.dispose();
            });
            it("uses the field only on the verified realistic back, keeping all eight selectable regions", async () => {
              vi.stubGlobal("fetch", vi.fn(async () => new Response(buffer("public/models/twin-body-v2.glb"))));
              const model = await loadTwinHuman("/models/twin-body-v2.glb", undefined, "realistic");
              for (const mesh of model.meshes) {
                if (Array.isArray(mesh.material)) throw new Error("Unexpected material array");
                expect(mesh.material.customProgramCacheKey().endsWith("-boundary-field-v1")).toBe(model.regionOf.get(mesh) === "back");
                expect(mesh.geometry.getAttribute("_twin_mask")).toBeUndefined();
              }
              expect(model.regionMeshes.size).toBe(8); model.dispose(); model.dispose();
            });
            it("preserves the analysis asset's authored masks exactly", async () => {
              const bytes = buffer("public/models/twin-selected-v1.glb");
              const gltf = await new GLTFLoader().parseAsync(bytes, "");
              const original: number[][] = [];
              gltf.scene.traverse((object) => {
                if (object instanceof Mesh) { const mask = object.geometry.getAttribute("_twin_mask"); original.push(mask ? Array.from(mask.array) : []); }
              });
              vi.stubGlobal("fetch", vi.fn(async () => new Response(bytes)));
              const model = await loadTwinHuman("/models/twin-selected-v1.glb", undefined, "analysis");
              expect(model.meshes.map((mesh) => Array.from(mesh.geometry.getAttribute("_twin_mask").array))).toEqual(original);
              model.dispose();
            });
            it("releases the field exactly once with its owning material", () => {
              const field = createTwinBoundaryField(new PlaneGeometry(0.2,0.2,2,2));
              const disposed = vi.fn(); field.texture.addEventListener("dispose", disposed);
              const material = createTwinBoundaryMaterial(TWIN_SKIN_MATERIAL, field);
              material.dispose(); material.dispose(); expect(disposed).toHaveBeenCalledTimes(1);
            });
            it("keeps the existing emissive mask and restores neutral roughness at the boundary", () => {
              const field = createTwinBoundaryField(new PlaneGeometry(0.2,0.2,2,2));
              const material = createTwinBoundaryMaterial(TWIN_SKIN_MATERIAL, field);
              // Only the three shader fields consumed by the documented callback;
              // the real WebGL compile is exercised by the browser comparison.
              const shader = { uniforms: {}, vertexShader: ShaderLib['standard']!.vertexShader, fragmentShader: ShaderLib['standard']!.fragmentShader } as Parameters<typeof material.onBeforeCompile>[0];
              material.onBeforeCompile(shader, {} as WebGLRenderer);
              expect(shader.vertexShader).not.toContain("_twin_mask");
              expect(shader.fragmentShader).toContain("texture2D(twinBoundaryTexture, vTwinBoundaryUv).r");
              expect(shader.fragmentShader).toContain("totalEmissiveRadiance *= twinSurfaceMask;");
              expect(shader.fragmentShader).toContain("mix(twinBoundaryNeutralRoughness, roughnessFactor, twinSurfaceMask)");
              expect(shader.uniforms['twinBoundaryTexture']?.value).toBe(field.texture);
              material.dispose();
            });
          });
          '''
          files['docs/twin-back-boundary.md']='''# Twin posterior selection edge — per-fragment refinement

          Base: PR149 f74861f5875bb93ba5ef248c608570b642fa5679 on released main 3967daa8.

          The first vertex-distance prototype passed automated checks but still showed coarse triangular transitions in screenshots. It is replaced, not shipped alongside another competing path.

          The registered generic Body back alone now uses a 256 × 256 single-channel field derived from its own XY triangle footprint. A smoothed signed chamfer-distance field softens the selection transition inside that footprint. A guard term keeps its existing border neutral. Per-fragment sampling avoids dependence on the coarse mesh's vertex spacing. Roughness returns to the neutral skin value with the same mask, preventing a selected-material sheen from retaining a hard triangle boundary.

          This is graphic treatment, not an anatomical measurement, personal scan, muscle-growth estimate or evidence source. Application is still gated by registered asset identity, Body appearance and back region. The Analysis model, other regions and personal Identity Shells are unchanged. Positions, indices, normals, UVs and picking stay intact; no asset bytes, database, providers or dependencies change.

          One R8 field is 65,536 bytes before driver overhead, with no mipmaps. No mesh or draw call is added. It is generated once per model load and disposed with its material; this is not a physical-iPhone performance claim.

          The source contract and full unit/TypeScript/lint/build gates must pass. The real WebGL comparison retains an unfeathered reference through a test-only source transform, never a production switch. It checks exact asset identity, absent evidence remaining absent, and a substantial visible back selection in both themes and two viewports. Screenshot review remains required. Neither synthetic browser tests nor public HTTP smoke establishes real-account or physical-device acceptance.
          '''
          p=Path('src/components/twin/twin-human.loader.ts');s=p.read_text()
          assert s.count('import { createTwinBoundaryMask } from "./twin-region-boundary";')==1
          s=s.replace('import { createTwinBoundaryMask } from "./twin-region-boundary";', 'import { createTwinBoundaryField } from "./twin-region-boundary";\nimport { createTwinBoundaryMaterial } from "./twin-boundary.material";')
          old='    if (featherBack)\n      object.geometry.setAttribute("_twin_mask", createTwinBoundaryMask(object.geometry));\n'
          assert s.count(old)==1;s=s.replace(old,'')
          old='    object.material = createTwinAnatomyMaterial('
          assert s.count(old)==1;s=s.replace(old,'    object.material = featherBack\n      ? createTwinBoundaryMaterial(preset, createTwinBoundaryField(object.geometry))\n      : createTwinAnatomyMaterial(')
          assert s.count('? { regionMask: featherBack }')==1;s=s.replace('? { regionMask: featherBack }','? {}')
          files[str(p)]=s
          for name,content in files.items():
              target=Path(name);target.parent.mkdir(parents=True,exist_ok=True);target.write_text(content)
          Path('test-results/twin-field').mkdir(parents=True,exist_ok=True)
          Path('test-results/twin-field/files.json').write_text(json.dumps(list(files)))
          PY
      - run: npm ci
      - run: node scripts/verify-ci-browser-runtime.mjs
      - name: Format changed source with the installed lint rules only
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {ESLint} from 'eslint';
          const files=JSON.parse(readFileSync('test-results/twin-field/files.json')).filter(p=>p.endsWith('.ts'));
          const formatter=new ESLint({fix:message=>message.ruleId==='prettier/prettier'});
          const results=await formatter.lintFiles(files);
          await ESLint.outputFixes(results);
          for(const result of results) assert.equal(result.errorCount,0,JSON.stringify({file:result.filePath,messages:result.messages}));
          JS
      - name: Complete quality gates and both builds without deploying
        shell: bash
        run: |
          set -euo pipefail
          { npm run typecheck; npm run test; npm run test:toolchain; npm run lint; npm run build:staging; npm run build; } 2>&1 | tee test-results/twin-field/quality.log
      - name: Real scene counterfactual comparison and unchanged skin acceptance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-twin-boundary-browser.mjs 2>&1 | tee test-results/twin-field/comparison.log
          node scripts/test-twin-skin-browser.mjs 2>&1 | tee test-results/twin-field/skin.log
      - name: Create tested commit object and diagnostic image gallery only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,readdirSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const repo=process.env.GITHUB_REPOSITORY, parent=process.env.CANDIDATE_PARENT;
          assert.equal(repo,'smirnov0707/gyms-life');
          const api=async(path,method='GET',data)=>{
            const r=await fetch(`https://api.github.com/repos/${repo}/${path}`,{method,headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});
            if(!r.ok)throw Error(`GitHub ${method} ${path}: ${r.status}`);return r.json();
          };
          assert.equal((await api('git/ref/heads/main')).object.sha,process.env.REVIEWED_MAIN);
          assert.equal((await api('git/ref/heads/fix/twin-back-boundary-2026-10-08')).object.sha,parent);
          const original=await api(`git/commits/${parent}`);
          const files=JSON.parse(readFileSync('test-results/twin-field/files.json'));
          assert.equal(files.length,5);
          const tree=await api('git/trees','POST',{base_tree:original.tree.sha,tree:files.map(path=>({path,mode:'100644',type:'blob',content:readFileSync(path,'utf8')}))});
          const candidate=await api('git/commits','POST',{message:'fix(twin): sample a smooth back-selection field per fragment\n\nReplace the vertex-mask prototype with a bounded R8 field on the verified generic Body back only. Preserve positions, topology, picking, Analysis and private identity surfaces. Fade neutral roughness with the selection; release the texture with the material. No deployment.',tree:tree.sha,parents:[parent]});
          const report={commit:candidate.sha,tree:tree.sha,parent,main:process.env.REVIEWED_MAIN,files:files.map(path=>({path,sha256:createHash('sha256').update(readFileSync(path)).digest('hex')})),quality:'passed',comparison:JSON.parse(readFileSync('test-results/twin-boundary/results.json')),skin:JSON.parse(readFileSync('test-results/twin-skin/results.json')),prBranchUpdated:false,deployed:false};
          writeFileSync('test-results/twin-field/verified-candidate.json',JSON.stringify(report,null,2));
          console.log('TESTED_CANDIDATE',candidate.sha);
          const branch='diagnostics/pr149-boundary-field-2026-10-08';
          const diagnostic=(await api(`git/ref/heads/${branch}`)).object.sha;
          assert.equal(diagnostic,process.env.GITHUB_SHA);
          const entries=[];
          let markdown=`# PR149 boundary field review\n\nTested candidate: ${candidate.sha}\n\nThis gallery contains synthetic test screenshots only. Main and the PR branch were NOT updated by this job.\n\n`;
          for(const name of readdirSync('test-results/twin-boundary').filter(p=>p.endsWith('.png')).sort()){
            const bytes=readFileSync(`test-results/twin-boundary/${name}`);
            const blob=await api('git/blobs','POST',{content:bytes.toString('base64'),encoding:'base64'});
            entries.push({path:`docs/pr149-field-review/${name}`,mode:'100644',type:'blob',sha:blob.sha});
            markdown+=`## ${name}\n\n![${name}](${name})\n\n`;
          }
          entries.push({path:'docs/pr149-field-review/README.md',mode:'100644',type:'blob',content:markdown});
          entries.push({path:'docs/pr149-field-review/verified-candidate.json',mode:'100644',type:'blob',content:JSON.stringify(report,null,2)});
          const diagTree=await api('git/trees','POST',{base_tree:(await api(`git/commits/${diagnostic}`)).tree.sha,tree:entries});
          const gallery=await api('git/commits','POST',{message:'test(review): retain exact PR149 field screenshots; no production changes',tree:diagTree.sha,parents:[diagnostic]});
          await api(`git/refs/heads/${branch}`,'PATCH',{sha:gallery.sha,force:false});
          writeFileSync('test-results/twin-field/gallery.json',JSON.stringify({commit:gallery.sha,candidate:candidate.sha},null,2));
          console.log('GALLERY',gallery.sha);
          JS
      - name: Retain final changed source after test discovery
        if: always()
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json,shutil
          manifest=Path('test-results/twin-field/files.json')
          if manifest.exists():
              for name in json.loads(manifest.read_text()):
                  source=Path(name)
                  if source.exists():
                      target=Path('test-results/twin-field/source')/name
                      target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(source,target)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr149-boundary-field-evidence
          path: |
            test-results/twin-field
            test-results/twin-boundary
            test-results/twin-skin
          retention-days: 14
          if-no-files-found: error
