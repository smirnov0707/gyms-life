name: Prepare Twin 360 dependencies
on:
  push:
    branches: [future-lab-phase-3-living-twin-foundation]
    paths: [.github/workflows/prepare-twin-360.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: future-lab-phase-3-living-twin-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --save-exact three@0.180.0
      - run: npm install --save-dev --save-exact @types/three@0.180.0 @playwright/test@1.55.0
      - name: Commit dependency lock without overwriting newer work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "build(twin): pin Three.js and browser regression tooling"
          git pull --rebase origin future-lab-phase-3-living-twin-foundation
          git push origin HEAD:future-lab-phase-3-living-twin-foundation
      - name: Export source for review (no credentials or user data)
        run: |
          mkdir -p /tmp/twin-source
          git archive HEAD | tar -x -C /tmp/twin-source
          tar -czf /tmp/twin-source.tar.gz -C /tmp/twin-source .
      - uses: actions/upload-artifact@v4
        with:
          name: twin-source
          path: /tmp/twin-source.tar.gz
          retention-days: 3
