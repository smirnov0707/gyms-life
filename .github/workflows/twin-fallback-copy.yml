name: Twin fallback status fix
on:
  push:
    branches: [future-lab-phase-3-living-twin-foundation]
    paths: [.github/workflows/twin-fallback-copy.yml]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: future-lab-phase-3-living-twin-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Separate status and action semantics
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/components/twin/TwinStage.tsx')
          s = p.read_text()
          assert s.count('{copy.fallback}') == 1
          p.write_text(s.replace('{copy.fallback}', '<p>{copy.fallback}</p>', 1))
          PY
      - run: npx prettier --write src/components/twin/TwinStage.tsx
      - name: Commit status markup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/twin/TwinStage.tsx
          git commit -m "fix(twin): give fallback status its own readable message"
          git pull --rebase origin future-lab-phase-3-living-twin-foundation
          git push origin HEAD:future-lab-phase-3-living-twin-foundation
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-twin-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twin-fallback-evidence
          path: test-results/twin
          retention-days: 3
          if-no-files-found: ignore
