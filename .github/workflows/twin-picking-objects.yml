name: Twin verified source objects
on:
  push:
    branches: [diagnostics/twin-navigation-source-2026-10-08]
    paths: [.github/workflows/twin-picking-objects.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
jobs:
  objects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 11574861850
          run-id: 37833750004
          github-token: ${{ github.token }}
          path: /tmp/twin-verified
      - name: Verify and export immutable blobs only; connector owns tree/ref publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,readdirSync,statSync,mkdirSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import path from 'node:path';
          const parent='299a9bc935de265e993d5531ac98dc2439d7cc54';
          const hidden='.github/workflows/twin-camera-navigation.yml';
          const allowed=['scripts/test-twin-camera-picking.mjs',hidden,'src/components/twin/twin-picking.profile.ts','src/components/twin/twin-picking.profile.test.ts','docs/twin-height-aware-picking.md','src/components/twin/twin-scene.runtime.ts'];
          const api=async(p,method='GET',data)=>{const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/${p}`,{method,headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});if(!r.ok)throw Error(`${method} ${p}: ${r.status}`);return r.json();};
          const metadata=await api('actions/artifacts/11574861850');
          assert.equal(metadata.digest,'sha256:5edbfcf77e7242833b2ed641066daae8936e81d39f40e7480ca9d66c769c63f6');
          assert.equal(metadata.workflow_run.id,37833750004);
          assert.equal(metadata.workflow_run.head_sha,'7bd550053ef0c20708de9762d7247a5a02b4d6d6');
          const {jobs}=await api('actions/runs/37833750004/jobs?per_page=10');
          const job=jobs.find(j=>j.id===113505430259);assert.ok(job);
          for(const name of ['Complete quality gates and both builds','Preserve all original navigation and trusted touch groups','Actual leg and back clicks in both registered models','Retain exact final source after test discovery'])
            assert.equal(job.steps.find(s=>s.name===name)?.conclusion,'success',name);
          const entries=[];function walk(dir){for(const name of readdirSync(dir)){const p=path.join(dir,name);statSync(p).isDirectory()?walk(p):entries.push(p);}}walk('/tmp/twin-verified');
          const one=suffix=>{const match=entries.filter(p=>p.endsWith('/'+suffix));assert.equal(match.length,1,suffix);return readFileSync(match[0],'utf8');};
          const normal=JSON.parse(one('twin-navigation/results.json')),picking=JSON.parse(one('twin-navigation/picking/results.json'));
          assert.equal(normal.results.length,6);assert.equal(picking.results.length,12);
          for(const result of [normal,picking]){assert.equal(result.failure,null);assert.deepEqual(result.errors,[]);for(const item of result.results)assert.equal(item.status,'passed');}
          assert.deepEqual(JSON.parse(one('picking-files.json')).sort(),[...allowed].sort());
          const quality=one('quality.log').replace(/\x1b\[[0-9;]*m/g,'');
          assert.match(quality,/Tests\s+2519 passed/);assert.match(quality,/Test Files\s+311 passed/);
          const pr=await api('pulls/151');assert.equal(pr.head.sha,parent);assert.equal(pr.state,'open');
          const originalYaml=await api(`contents/${hidden}?ref=6c1066fdc2413796ae5a548e618435d098e2213a`);
          assert.equal(originalYaml.sha,'b69f5a506dc809a38d610b4e6581a0ceab86c606');
          const files=[];
          mkdirSync('verified-output',{recursive:true});
          for(const name of allowed){
            const content=name===hidden?Buffer.from(originalYaml.content,'base64').toString('utf8'):one('reviewed-source/'+name);
            const bytes=Buffer.from(content,'utf8');
            const expectedSha=createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            const blob=name===hidden?{sha:originalYaml.sha}:await api('git/blobs','POST',{content,encoding:'utf-8'});
            assert.equal(blob.sha,expectedSha);
            files.push({path:name,mode:'100644',type:'blob',sha:blob.sha,sha256:createHash('sha256').update(bytes).digest('hex'),source:name===hidden?'immutable original YAML, omitted by upload defaults':'digest-verified retained formatted source'});
            const dest=path.join('verified-output','source',name);mkdirSync(path.dirname(dest),{recursive:true});writeFileSync(dest,content);
          }
          const report={parent,baseTree:'dbc285c142938b90f9d2a2c6d6917bd42d2f5269',sourceRun:37833750004,sourceArtifact:11574861850,digest:metadata.digest,files,tests:{unit:2519,files:311,navigation:6,picking:12,typecheck:'passed',toolchain:'passed',lint:'passed',buildStaging:'passed',buildMain:'passed'},treeCreated:false,prUpdated:false,deployed:false};
          writeFileSync('verified-output/verified-source.json',JSON.stringify(report,null,2));
          writeFileSync('verified-output/navigation-results.json',JSON.stringify(normal,null,2));
          writeFileSync('verified-output/picking-results.json',JSON.stringify(picking,null,2));
          console.log('VERIFIED_SOURCE_OBJECTS',JSON.stringify(report));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: twin-verified-source-objects
          path: verified-output
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
