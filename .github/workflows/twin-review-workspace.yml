name: Twin review workspace
on:
  push:
    branches: [future-lab-twin-review-workspace]
    paths: [.github/workflows/twin-review-workspace.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 37b51a69d27f83ccc40cf41b046cb8147e0f8f10
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked source only; exclude unchanged media and credentials
        run: |
          set -eu
          mkdir -p /tmp/twin-review/{export,head,main,base}
          git archive HEAD | tar -x --exclude=public -C /tmp/twin-review/head
          git archive 77cca61fde5dc07163b8d5313d980cf91c3e4810 | tar -x --exclude=public -C /tmp/twin-review/main
          BASE=$(git merge-base HEAD 77cca61fde5dc07163b8d5313d980cf91c3e4810)
          git archive "$BASE" | tar -x --exclude=public -C /tmp/twin-review/base
          for TREE in head main base; do tar -czf /tmp/twin-review/export/$TREE.tar.gz -C /tmp/twin-review/$TREE .; done
          printf 'head=%s\nmain=%s\nbase=%s\n' "$(git rev-parse HEAD)" 77cca61fde5dc07163b8d5313d980cf91c3e4810 "$BASE" > /tmp/twin-review/export/refs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: twin-concurrent-review-source
          path: /tmp/twin-review/export
          retention-days: 1
          compression-level: 0
