name: Integrate reviewed human presentation
on:
  push:
    branches: [future-lab-human-realism-preview]
    paths: [.github/workflows/integrate-human-preview.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply only the three inspected integration paths
        run: |
          test "$GITHUB_REF" = refs/heads/future-lab-human-realism-preview
          git apply --check .human-preview-integration.patch
          git apply .human-preview-integration.patch
          npx prettier --write src/components/twin/human-*.ts src/components/twin/TwinStage.tsx src/components/twin/twin-scene.runtime.ts scripts/test-human-browser.mjs tests/human-browser/probe.ts
          git diff --check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run build
      - name: Publish only validated source to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify.toml src/components/twin/TwinStage.tsx src/components/twin/twin-scene.runtime.ts src/components/twin/human-*.ts scripts/test-human-browser.mjs tests/human-browser/probe.ts
          git rm .human-preview-integration.patch
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git commit -m 'feat(twin): integrate textured-human preview with truthful overlays and fallback'
          git push origin HEAD:future-lab-human-realism-preview
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-human-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-integration-first-review
          path: test-results/human
          retention-days: 7
          if-no-files-found: ignore
