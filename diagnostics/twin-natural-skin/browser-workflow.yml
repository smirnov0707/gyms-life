name: Twin skin visibility browser
on:
  pull_request:
    paths: &paths
      - 'src/components/twin/**'
      - 'scripts/test-twin-skin-browser.mjs'
      - '.github/workflows/twin-skin-browser.yml'
      - '.github/playwright-image.json'
      - 'public/models/**'
      - 'package*.json'
  push:
    branches: [main]
    paths: *paths
permissions:
  contents: read
concurrency:
  group: twin-skin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --init
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-ci-browser-runtime.mjs
      - run: node scripts/test-twin-skin-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twin-skin-visibility
          path: test-results/twin-skin
          retention-days: 14
          if-no-files-found: error
